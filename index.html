  $("cfg-logo-file").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const url = await uploadBrandingOrAvatar(f, "branding", 400, true);
      await saveAppearanceSetting("logo_url", "vx_logo_url", url, "Logo de la clínica actualizado.");
    } catch { toast("No se pudo subir el logo.", true); }
  };
  if ($("cfg-logo-reset")) $("cfg-logo-reset").onclick = () => saveAppearanceSetting("logo_url", "vx_logo_url", "", "Logo restaurado al original.");

  $("cfg-fav-file").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const url = await uploadBrandingOrAvatar(f, "branding", 128, true);
      await saveAppearanceSetting("favicon_url", "vx_favicon_url", url, "Icono de página actualizado.");
    } catch { toast("No se pudo subir el icono.", true); }
  };
  if ($("cfg-fav-reset")) $("cfg-fav-reset").onclick = () => saveAppearanceSetting("favicon_url", "vx_favicon_url", "", "Icono de página restaurado.");

  document.querySelectorAll("[data-bg-preset]").forEach(btn => {
    btn.onclick = () => saveAppearanceSetting("custom_bg", "vx_custom_bg", btn.dataset.bgPreset, "Fondo actualizado.");
  });
  $("cfg-bg-file").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const url = await uploadBrandingOrAvatar(f, "branding", 1600, false);
      await saveAppearanceSetting("custom_bg", "vx_custom_bg", url, "Imagen de fondo aplicada.");
    } catch { toast("No se pudo procesar la imagen de fondo.", true); }
  };
  if ($("cfg-bg-reset")) $("cfg-bg-reset").onclick = () => saveAppearanceSetting("custom_bg", "vx_custom_bg", "", "Fondo restaurado.");

  $("cfg-login-bg-file").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const url = await uploadBrandingOrAvatar(f, "branding", 1600, false);
      await saveAppearanceSetting("login_bg", "vx_login_bg", url, "Fondo de portada actualizado.");
    } catch { toast("No se pudo procesar la imagen.", true); }
  };
  if ($("cfg-login-bg-reset")) $("cfg-login-bg-reset").onclick = () => saveAppearanceSetting("login_bg", "vx_login_bg", "", "Fondo de portada restaurado.");

  $("f-cfg").onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {
      nombre_clinica: fd.get("nombre_clinica").trim(),
      nit_ruc: fd.get("nit_ruc").trim(),
      pais: fd.get("pais").trim(),
      ciudad: fd.get("ciudad").trim(),
      moneda: fd.get("moneda").trim() || "$",
      impuesto_nombre: fd.get("impuesto_nombre").trim() || "IVA",
      impuesto_porcentaje: Number(fd.get("impuesto_porcentaje") || 0),
      telefono: fd.get("telefono").trim(),
      email: fd.get("email").trim(),
      horario: fd.get("horario").trim(),
      direccion: fd.get("direccion").trim(),
      sedes: fd.get("sedes").trim(),
      metodos_pago: fd.get("metodos_pago").trim()
    };
    state.config = { ...state.config, ...payload };
    localStorage.setItem("vx_config_cache", JSON.stringify(state.config));
    try {
      const existing = await db.list("configuracion_clinica", "id", true);
      if (existing && existing.length) await db.update("configuracion_clinica", existing[0].id, payload);
      else await db.insert("configuracion_clinica", { id: 1, ...payload });
    } catch {}
    log("Actualizó configuración", "configuracion_clinica", payload.nombre_clinica);
    renderSaas(); toast("Configuración guardada.");
  };
  icons();
}

/* ============ 16. AUDITORÍA / REGISTRO DE ACTIVIDAD ============ */
function viewAuditoria(){
  if (!isAdmin()) return viewDashboard();
  $("workspace").innerHTML = `
    <div class="page-head">
      <div><h1 class="page-title">Registro de Actividad y Auditoría</h1><p class="page-sub">Trazabilidad completa de acciones realizadas por el personal en el sistema</p></div>
    </div>
    <div class="card"><div class="tbl-wrap"><table class="saas-tbl">
      <thead><tr><th>Fecha y Hora</th><th>Usuario</th><th>Acción</th><th>Módulo / Entidad</th><th>Detalle</th></tr></thead>
      <tbody>
        ${state.actividad.map(a => `<tr>
          <td>${fechaHora(a.creado_en)}</td>
          <td><strong>${esc(a.usuario_email || "—")}</strong></td>
          <td>${esc(a.accion)}</td>
          <td><span class="badge b-gray">${esc(a.entidad || "—")}</span></td>
          <td>${esc(a.detalle || "—")}</td>
        </tr>`).join("") || `<tr><td colspan="5">Sin registros de auditoría aún.</td></tr>`}
      </tbody>
    </table></div></div>
  `;
}

/* ============ ARRANCAR APLICACIÓN ============ */
function render(){
  if (publicId && (!perfil || forzarPublico)) return pintarPublico();
  if (!perfil) return pintarPortada();
  renderSaas();
}

(async () => {
  await loadPublicBranding();
  const { data: { session } } = await sb.auth.getSession();
  if (session){
    const r = await cargarPerfil(session.user);
    if (r) toast(r === "bloqueado" ? "Tu acceso está bloqueado." : "Cuenta sin perfil.", true);
    else await syncAllData();
  }
  render();
  startNfcBridge();
  sb.auth.onAuthStateChange((ev, s) => {
    if (ev === "SIGNED_OUT" && perfil){ perfil = null; render(); }
    if (ev === "SIGNED_IN" && s && !perfil) cargarPerfil(s.user).then(async () => { if (perfil) await syncAllData(); render(); });
  });
})();
</script>
