<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>VEXAVET | Plataforma Clínica Veterinaria</title>
<link id="app-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d9488'/%3E%3Cpath d='M12 34h10l5-12 9 24 6-14h10' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Montserrat:wght@800&family=Zilla+Slab:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:light;
  --saas-bg:#f3f6fa;
  --saas-card:#ffffff;
  --saas-ink:#0f172a;
  --saas-muted:#64748b;
  --saas-border:#e2e8f0;
  --saas-pri:#0d9488;
  --saas-pri-dark:#0f766e;
  --saas-pri-soft:#ccfbf1;
  --saas-sec:#2563eb;
  --saas-sec-soft:#dbeafe;
  --saas-sidebar:#0f172a;
  --saas-sidebar-hover:#1e293b;
  --saas-sidebar-active:#0d9488;
  --fondo:var(--saas-bg);
  --panel:var(--saas-card);
  --tinta:var(--saas-ink);
  --suave:var(--saas-muted);
  --linea:var(--saas-border);
  --pri:var(--saas-pri);
  --pri2:var(--saas-pri-dark);
  --acento:var(--saas-sec);
  --aviso:#f59e0b;
  --peligro:#dc2626;
  --ro:var(--saas-pri-soft);
  --bloq:var(--saas-sec-soft);
  --bloq-borde:#bfdbfe;
  --r:12px;
  --ok:#16a34a;--ok-soft:#dcfce7;
  --warn:#d97706;--warn-soft:#fef3c7;
  --err:#dc2626;--err-soft:#fee2e2;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow-md:0 4px 14px rgba(15,23,42,.07);

  /* Variables de Portada y Login Vexavet */
  --vx-primary:#2563eb;
  --vx-primary-hover:#1d4ed8;
  --vx-primary-soft:rgba(37,99,235,0.1);
  --vx-accent:#0ea5e9;
  --vx-text-main:#0f172a;
  --vx-text-muted:#475569;
  --vx-border:rgba(15,23,42,0.08);
  --vx-input-border:#cbd5e1;
  --vx-card-bg:rgba(255,255,255,0.92);
  --vx-bg-image:url('https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&fit=crop&w=1920&q=80');
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--saas-bg);color:var(--saas-ink);font:400 15px/1.5 Figtree,system-ui,sans-serif;min-height:100vh}
body.saas-mode{background:var(--saas-bg);color:var(--saas-ink)}
h1,h2,h3,h4{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0;letter-spacing:-.015em}

/* ================= PORTADA DE BIENVENIDA Y LOGIN (INDEX 2) ================= */
body.login-mode{
  font-family:'Inter',Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background-color:#0f172a;
  background-image:var(--vx-bg-image);
  background-size:cover;
  background-position:center;
  position:relative;
  overflow-x:hidden;
  padding:1.5rem;
}

.vx-backdrop-blur{
  position:fixed;
  inset:0;
  background:linear-gradient(
    135deg,
    rgba(15,23,42,0.76) 0%,
    rgba(30,41,59,0.66) 100%
  );
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  z-index:1;
}

.vx-welcome-card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:960px;
  display:grid;
  grid-template-columns:1.25fr 0.75fr;
  background:var(--vx-card-bg);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.75);
  border-radius:22px;
  overflow:hidden;
  box-shadow:
    0 25px 50px -12px rgba(0,0,0,0.48),
    0 0 0 1px rgba(15,23,42,0.05);
  transition:transform 0.16s cubic-bezier(0.2,0,0,1);
  will-change:transform;
}

body.vx-login-open .vx-welcome-card{
  transform:scale(0.985);
  pointer-events:none;
}

.vx-welcome-content{
  padding:2.35rem 2.25rem 1.85rem;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.vx-brand-header{
  text-align:center;
  margin-bottom:1.45rem;
}

.vx-brand-badge{
  width:52px;
  height:52px;
  margin:0 auto 0.85rem;
  background:linear-gradient(135deg,var(--vx-primary),var(--vx-accent));
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ffffff;
  overflow:hidden;
  box-shadow:0 10px 20px -5px rgba(37,99,235,0.4);
}
.vx-brand-badge img{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#ffffff;
  padding:4px;
}

.vx-system-pill{
  display:inline-flex;
  align-items:center;
  gap:0.4rem;
  font-size:0.73rem;
  font-weight:600;
  letter-spacing:0.03em;
  text-transform:uppercase;
  color:var(--vx-primary);
  background:var(--vx-primary-soft);
  padding:0.28rem 0.72rem;
  border-radius:999px;
  margin-bottom:0.65rem;
}

.vx-status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background-color:#10b981;
  box-shadow:0 0 0 2px rgba(16,185,129,0.25);
}

.vx-welcome-title{
  font-family:'Inter',Figtree,sans-serif;
  font-size:1.65rem;
  font-weight:700;
  color:var(--vx-text-main);
  letter-spacing:-0.025em;
  margin-bottom:0.45rem;
}

.vx-welcome-desc{
  font-size:0.9rem;
  line-height:1.52;
  color:var(--vx-text-muted);
  max-width:460px;
  margin:0 auto;
}

.vx-modules-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:0.7rem;
  margin-bottom:1.55rem;
}

.vx-module-item{
  display:flex;
  align-items:flex-start;
  gap:0.65rem;
  padding:0.8rem;
  background:rgba(255,255,255,0.72);
  border:1px solid var(--vx-border);
  border-radius:13px;
  transition:transform 0.15s ease,background-color 0.15s ease;
}

.vx-module-item:hover{
  background:#ffffff;
  transform:translateY(-1px);
}

.vx-module-icon{
  flex-shrink:0;
  width:32px;
  height:32px;
  border-radius:9px;
  background:var(--vx-primary-soft);
  color:var(--vx-primary);
  display:flex;
  align-items:center;
  justify-content:center;
}

.vx-module-info h3{
  font-family:'Inter',Figtree,sans-serif;
  font-size:0.83rem;
  font-weight:600;
  color:var(--vx-text-main);
  margin:0 0 0.15rem;
}

.vx-module-info p{
  font-size:0.74rem;
  line-height:1.38;
  color:var(--vx-text-muted);
  margin:0;
}

.vx-btn-primary{
  width:100%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:0.6rem;
  background-color:var(--vx-primary);
  color:#ffffff;
  font-family:'Inter',Figtree,sans-serif;
  font-size:0.95rem;
  font-weight:600;
  padding:0.88rem 1.5rem;
  border:none;
  border-radius:12px;
  cursor:pointer;
  transition:background-color 0.15s ease,transform 0.12s ease,box-shadow 0.15s ease;
  box-shadow:0 4px 14px rgba(37,99,235,0.28);
}

.vx-btn-primary:hover{
  background-color:var(--vx-primary-hover);
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(37,99,235,0.36);
}

.vx-btn-primary:active{
  transform:scale(0.99);
}

.vx-btn-primary:disabled{
  opacity:0.65;
  cursor:not-allowed;
  transform:none;
}

.vx-btn-primary svg{
  transition:transform 0.15s ease;
}

.vx-btn-primary:hover svg{
  transform:translateX(3px);
}

.vx-card-footer{
  margin-top:1.35rem;
  padding-top:1rem;
  border-top:1px solid var(--vx-border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:0.5rem;
  font-size:0.76rem;
  color:#64748b;
}

.vx-footer-badge{
  display:inline-flex;
  align-items:center;
  gap:0.38rem;
}

.vx-welcome-media{
  position:relative;
  height:100%;
  min-height:100%;
  background:linear-gradient(160deg,#1e3a8a 0%,#0f172a 100%);
  overflow:hidden;
}

.vx-welcome-media img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}

.vx-media-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(15,23,42,0.82) 0%,
    rgba(15,23,42,0.22) 45%,
    rgba(37,99,235,0.12) 100%
  );
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:1.65rem;
  color:#ffffff;
}

.vx-media-tag{
  display:inline-block;
  width:fit-content;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.28);
  padding:0.28rem 0.65rem;
  border-radius:8px;
  margin-bottom:0.55rem;
}

.vx-media-caption{
  font-size:0.88rem;
  font-weight:500;
  line-height:1.45;
  color:rgba(255,255,255,0.94);
  margin:0;
}

/* Modal de Login Ultrarrápido */
.vx-login-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(15,23,42,0.58);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1.5rem;
  opacity:0;
  visibility:hidden;
  transition:opacity 0.14s ease-out,visibility 0.14s ease-out;
  font-family:'Inter',Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

.vx-login-overlay.is-active{
  opacity:1;
  visibility:visible;
}

.vx-login-modal{
  position:relative;
  width:100%;
  max-width:410px;
  background:#ffffff;
  border:1px solid rgba(255,255,255,0.9);
  border-radius:20px;
  padding:2.15rem 2rem;
  box-shadow:
    0 25px 50px -12px rgba(0,0,0,0.55),
    0 0 0 1px rgba(15,23,42,0.08);
  transform:translateY(10px) scale(0.98);
  transition:transform 0.16s cubic-bezier(0.2,0,0,1);
  will-change:transform;
}

.vx-login-overlay.is-active .vx-login-modal{
  transform:translateY(0) scale(1);
}

.vx-btn-close{
  position:absolute;
  top:1.1rem;
  right:1.1rem;
  width:34px;
  height:34px;
  border-radius:10px;
  border:none;
  background:rgba(15,23,42,0.05);
  color:var(--vx-text-muted);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background-color 0.15s ease,color 0.15s ease;
}

.vx-btn-close:hover{
  background:rgba(15,23,42,0.12);
  color:var(--vx-text-main);
}

.vx-login-header{
  text-align:center;
  margin-bottom:1.5rem;
}

.vx-login-header .vx-brand-badge{
  width:46px;
  height:46px;
  margin:0 auto 0.8rem;
  border-radius:12px;
}

.vx-login-title{
  font-family:'Inter',Figtree,sans-serif;
  font-size:1.38rem;
  font-weight:700;
  color:var(--vx-text-main);
  letter-spacing:-0.025em;
  margin-bottom:0.25rem;
}

.vx-login-subtitle{
  font-size:0.86rem;
  color:var(--vx-text-muted);
  margin:0;
}

.vx-login-form{
  display:flex;
  flex-direction:column;
  gap:1rem;
}

.vx-form-group{
  display:flex;
  flex-direction:column;
  gap:0.35rem;
  text-align:left;
}

.vx-form-label{
  display:block;
  font-size:0.83rem;
  font-weight:600;
  color:var(--vx-text-main);
  margin-bottom:0;
}

.vx-input-wrapper{
  position:relative;
  display:flex;
  align-items:center;
}

.vx-input-icon{
  position:absolute;
  left:0.9rem;
  color:#64748b;
  pointer-events:none;
  display:flex;
}

.vx-form-input{
  width:100%;
  padding:0.75rem 1rem 0.75rem 2.65rem;
  min-height:44px;
  font-family:'Inter',Figtree,sans-serif;
  font-size:0.92rem;
  color:var(--vx-text-main);
  background-color:#ffffff;
  border:1px solid var(--vx-input-border);
  border-radius:11px;
  outline:none;
  transition:border-color 0.15s ease,box-shadow 0.15s ease;
}

.vx-form-input.has-toggle{
  padding-right:2.75rem;
}

.vx-form-input::placeholder{
  color:#94a3b8;
}

.vx-form-input:focus{
  border-color:var(--vx-primary);
  box-shadow:0 0 0 3.5px rgba(37,99,235,0.15);
}

.vx-toggle-pass{
  position:absolute;
  right:0.75rem;
  background:none;
  border:none;
  color:#64748b;
  cursor:pointer;
  padding:0.25rem;
  display:flex;
  align-items:center;
}

.vx-toggle-pass:hover{
  color:var(--vx-text-main);
}

.vx-form-options{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:0.82rem;
}

.vx-remember-label{
  display:inline-flex;
  align-items:center;
  gap:0.45rem;
  color:var(--vx-text-muted);
  font-weight:400;
  margin-bottom:0;
  cursor:pointer;
  user-select:none;
}

.vx-remember-label input[type="checkbox"]{
  width:15px;
  height:15px;
  min-height:0;
  padding:0;
  accent-color:var(--vx-primary);
  cursor:pointer;
}

.vx-forgot-link{
  color:var(--vx-primary);
  font-weight:500;
  text-decoration:none;
}

.vx-forgot-link:hover{
  text-decoration:underline;
}

@media (max-width:860px){
  .vx-welcome-card{
    max-width:560px;
    grid-template-columns:1fr;
  }
  .vx-welcome-media{
    order:-1;
    height:190px;
  }
}

@media (max-width:540px){
  body.login-mode{
    padding:1rem;
  }
  .vx-welcome-content{
    padding:1.75rem 1.35rem 1.5rem;
  }
  .vx-modules-grid{
    grid-template-columns:1fr;
  }
  .vx-welcome-title{
    font-size:1.45rem;
  }
  .vx-card-footer{
    justify-content:center;
  }
}

/* ================= PERFIL PÚBLICO ================= */
.app{max-width:1120px;margin:0 auto;padding:20px 20px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px;position:relative;padding:12px 18px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--saas-border);border-radius:14px;box-shadow:var(--shadow-sm)}
.marca{display:inline-flex;align-items:center;gap:10px;font:800 1.35rem "Bricolage Grotesque",sans-serif;color:var(--saas-ink);text-decoration:none}
.marca small{font:500 .84rem Figtree,sans-serif;color:var(--saas-muted);margin-left:2px;padding-left:10px;border-left:1px solid var(--saas-border)}
#nav,#sesion,.fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:.86rem;color:var(--saas-muted)}
.panel{background:var(--saas-card);border:1px solid var(--saas-border);border-radius:14px;box-shadow:var(--shadow-sm)}
.pad{padding:24px}
.avatar{flex:none;border-radius:50%;overflow:hidden;background:var(--saas-pri-soft);color:var(--saas-pri-dark);display:grid;place-items:center;font:700 1rem "Bricolage Grotesque",sans-serif;width:92px;height:92px;font-size:2.2rem;border:3px solid #fff;box-shadow:0 4px 12px rgba(13,148,136,.18)}
.avatar img{width:100%;height:100%;object-fit:cover}
.cab{display:flex;gap:18px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.cab-t{display:grid;gap:6px;min-width:0}
.pub{max-width:700px;margin:0 auto;padding:28px}.pub .avatar{width:108px;height:108px;font-size:2.6rem}
.pub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0 22px}
.pub-stat{background:#f8fafc;border:1px solid var(--saas-border);border-radius:10px;padding:10px 14px}
.pub-stat dt{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--saas-muted);font-weight:600;margin-bottom:2px}
.pub-stat dd{margin:0;font-weight:700;color:var(--saas-ink);font-size:.95rem}
.ok{color:var(--ok);font-weight:600}.venc{color:var(--err);font-weight:600}
label{display:block;font-size:.83rem;font-weight:600;margin-bottom:4px;color:inherit}
input,select,textarea{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid var(--saas-border);border-radius:8px;padding:8px 11px;min-height:38px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--saas-pri);box-shadow:0 0 0 3px rgba(13,148,136,.14)}
textarea{min-height:78px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:#f1f5f9;color:#64748b;cursor:not-allowed}
.btn{font:600 .88rem Figtree,sans-serif;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--saas-border);background:#fff;color:var(--saas-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:#94a3b8;background:#f8fafc}
.btn.pri{background:var(--saas-pri);border-color:var(--saas-pri);color:#fff;box-shadow:0 2px 6px rgba(13,148,136,.22)}.btn.pri:hover{background:var(--saas-pri-dark);border-color:var(--saas-pri-dark)}
.btn.sec{background:var(--saas-sec);border-color:var(--saas-sec);color:#fff}.btn.sec:hover{background:#1d4ed8}
.btn.pel{color:var(--err);border-color:#fecaca;background:#fff}.btn.pel:hover{background:var(--err-soft)}
.btn.rojo{background:var(--err);border-color:var(--err);color:#fff}
.btn.verde{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{min-height:32px;padding:0 10px;font-size:.8rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* NFC Indicator Pill */
.nfc-pill{display:inline-flex;align-items:center;gap:6px;padding:0 10px;height:32px;border-radius:99px;border:1px solid var(--saas-border);background:#f8fafc;color:var(--saas-muted);font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s}
.nfc-pill:hover{border-color:#94a3b8}
.nfc-pill.on{background:#dcfce7;border-color:#86efac;color:#15803d}
.nfc-dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
.nfc-pill.on .nfc-dot{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.25)}

.clave{position:relative}.clave input{padding-right:44px}
.ojo{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;display:grid;place-items:center;border:0;border-radius:6px;background:none;color:var(--saas-pri);cursor:pointer}
.ojo svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ================= SAAS WORKSPACE & MENÚ HAMBURGUESA ================= */
.saas-shell{display:flex;min-height:100vh}
.sidebar{width:268px;background:var(--saas-sidebar);color:#cbd5e1;display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:none}
.sidebar.open{transform:translateX(0);box-shadow:0 20px 50px rgba(15,23,42,.38)}
.sb-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(1px);z-index:45}
.sb-backdrop.open{display:block}
.sb-brand{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{display:flex;align-items:center;gap:10px;color:#fff;font:800 1.25rem "Bricolage Grotesque",sans-serif;text-decoration:none}
.sb-logo-badge{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0d9488,#2563eb);display:grid;place-items:center;color:#fff;overflow:hidden;flex-shrink:0}
.sb-logo-badge img{width:100%;height:100%;object-fit:contain;background:#fff;padding:2px}
.sb-close{width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#cbd5e1;display:grid;place-items:center;cursor:pointer;transition:all .15s}
.sb-close:hover{background:rgba(255,255,255,.16);color:#fff}
.sb-clinic{padding:10px 20px;font-size:.76rem;color:#94a3b8;background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{flex:1;overflow-y:auto;padding:12px 10px}
.sb-group{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#64748b;padding:12px 12px 4px}
.sb-item{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:0;background:transparent;color:#cbd5e1;font:500 .88rem Figtree,sans-serif;cursor:pointer;text-align:left;transition:all .15s;margin-bottom:2px}
.sb-item:hover{background:var(--saas-sidebar-hover);color:#fff}
.sb-item.active{background:var(--saas-sidebar-active);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(13,148,136,.35)}
.sb-item svg{width:17px;height:17px;flex-shrink:0}
.sb-badge{margin-left:auto;background:#ef4444;color:#fff;font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:99px}
.sb-footer{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:10px}

.saas-main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:62px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--saas-border);padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:25}
.tb-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.tb-burger{display:grid;place-items:center;background:#fff;border:1px solid var(--saas-border);border-radius:9px;width:38px;height:38px;cursor:pointer;color:var(--saas-ink);flex-shrink:0;transition:all .15s}
.tb-burger:hover{background:#f1f5f9;border-color:#94a3b8}
.tb-brand-mini{display:inline-flex;align-items:center;gap:8px;font:800 1.08rem "Bricolage Grotesque",sans-serif;color:var(--saas-ink);text-decoration:none;flex-shrink:0}
.global-search{position:relative;max-width:340px;width:100%}
.global-search input{padding-left:34px;background:#f8fafc;border-color:#e2e8f0;min-height:36px;font-size:.86rem}
.global-search .gs-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#94a3b8;pointer-events:none;display:grid}
.gs-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--saas-border);border-radius:10px;box-shadow:var(--shadow-md);max-height:320px;overflow-y:auto;z-index:50}
.gs-item{padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:.85rem}
.gs-item:hover{background:#f8fafc}
.tb-right{display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:8px;border:1px solid var(--saas-border);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--saas-ink)}
.icon-btn:hover{background:#f8fafc}
.notif-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:#ef4444}
.notif-pop{position:absolute;top:54px;right:22px;width:min(360px,92vw);background:#fff;border:1px solid var(--saas-border);border-radius:12px;box-shadow:var(--shadow-md);z-index:50;overflow:hidden}
.user-pill{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 6px;border:1px solid var(--saas-border);border-radius:99px;background:#f8fafc;cursor:pointer;font-size:.83rem;font-weight:600}
.user-ava{width:28px;height:28px;border-radius:50%;background:var(--saas-pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.78rem;overflow:hidden;flex-shrink:0}
.user-ava img{width:100%;height:100%;object-fit:cover}

.sync-banner{background:#fef3c7;border-bottom:1px solid #fde68a;color:#92400e;padding:7px 22px;font-size:.82rem;display:flex;align-items:center;justify-content:space-between;gap:10px}
.workspace{padding:22px;max-width:1440px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-title{font-size:1.45rem;font-weight:700;color:var(--saas-ink)}
.page-sub{font-size:.86rem;color:var(--saas-muted);margin-top:2px}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.kpi-card{background:#fff;border:1px solid var(--saas-border);border-radius:12px;padding:16px;box-shadow:var(--shadow-sm);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.kpi-label{font-size:.8rem;font-weight:600;color:var(--saas-muted)}
.kpi-val{font:700 1.6rem "Bricolage Grotesque",sans-serif;color:var(--saas-ink);margin-top:4px}
.kpi-foot{font-size:.75rem;color:var(--saas-muted);margin-top:4px}
.kpi-ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}

.card{background:#fff;border:1px solid var(--saas-border);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden}
.card-head{padding:14px 18px;border-bottom:1px solid var(--saas-border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-title{font-size:1rem;font-weight:700}
.card-body{padding:18px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form-grid .full{grid-column:1/-1}

.bg-swatch{width:28px;height:28px;border-radius:8px;border:2px solid #cbd5e1;cursor:pointer;transition:transform .12s,border-color .12s}
.bg-swatch:hover{transform:scale(1.08);border-color:var(--saas-pri)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:.76rem;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-err{background:var(--err-soft);color:var(--err)}
.b-info{background:var(--saas-sec-soft);color:var(--saas-sec)}
.b-teal{background:var(--saas-pri-soft);color:var(--saas-pri-dark)}
.b-gray{background:#f1f5f9;color:#475569}

.tbl-wrap{overflow-x:auto}
table.saas-tbl{width:100%;border-collapse:collapse;font-size:.87rem}
table.saas-tbl th{background:#f8fafc;color:var(--saas-muted);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--saas-border);white-space:nowrap;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
table.saas-tbl td{padding:11px 14px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
table.saas-tbl tr:hover td{background:#f8fafc}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{width:auto;min-width:190px}

.tabs-bar{display:flex;gap:4px;border-bottom:1px solid var(--saas-border);margin-bottom:16px;overflow-x:auto}
.tab-btn{padding:10px 14px;border:0;background:none;border-bottom:2px solid transparent;font:600 .86rem Figtree,sans-serif;color:var(--saas-muted);cursor:pointer;white-space:nowrap}
.tab-btn.active{color:var(--saas-pri);border-bottom-color:var(--saas-pri)}

.pet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:14px}
.pet-card{background:#fff;border:1px solid var(--saas-border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:transform .15s,box-shadow .15s}
.pet-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.pet-ava{width:54px;height:54px;border-radius:50%;background:var(--saas-pri-soft);color:var(--saas-pri-dark);display:grid;place-items:center;font:700 1.25rem "Bricolage Grotesque",sans-serif;overflow:hidden;flex-shrink:0}
.pet-ava img{width:100%;height:100%;object-fit:cover}

.timeline{position:relative;padding-left:24px;display:grid;gap:14px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:#e2e8f0}
.tl-item{position:relative;background:#fff;border:1px solid var(--saas-border);border-radius:10px;padding:14px}
.tl-dot{position:absolute;left:-22px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--saas-pri);border:2px solid #fff;box-shadow:0 0 0 2px var(--saas-pri)}

.pos-layout{display:grid;grid-template-columns:1.35fr .95fr;gap:18px;align-items:start}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}
.prod-tile{border:1px solid var(--saas-border);border-radius:10px;padding:12px;background:#fff;cursor:pointer;text-align:left;transition:all .15s;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.prod-tile:hover{border-color:var(--saas-pri);box-shadow:var(--shadow-sm)}

@media (max-width:960px){
  .pos-layout,.grid-2,.grid-3{grid-template-columns:1fr}
  .hide-sm{display:none}
}
@media (max-width:600px){
  .form-grid{grid-template-columns:1fr}
  .workspace{padding:14px}
}
@media print{
  .sidebar,.topbar,.no-print,#toast,.sync-banner,.sb-backdrop{display:none!important}
  .saas-main,.workspace{padding:0!important;margin:0!important;max-width:100%!important}
  body{background:#fff!important}
}
</style>

<body>
<div id="root"></div>

<!-- VENTANA DE LOGIN (Modal rápido superpuesto de index2) -->
<div class="vx-login-overlay" id="vxLoginOverlay" role="dialog" aria-modal="true" aria-labelledby="vxLoginTitle">
  <div class="vx-login-modal">
    <button type="button" class="vx-btn-close" id="l-x" aria-label="Cerrar ventana de acceso">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <div class="vx-login-header">
      <div class="vx-brand-badge" id="dlg-login-logo"></div>
      <h2 class="vx-login-title" id="vxLoginTitle">Acceso a Vexavet</h2>
      <p class="vx-login-subtitle">Ingresa tus credenciales de personal autorizado</p>
    </div>

    <form class="vx-login-form" id="fl">
      <div class="vx-form-group">
        <label for="l-mail" class="vx-form-label">Usuario o correo electrónico</label>
        <div class="vx-input-wrapper">
          <span class="vx-input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input
            type="text"
            id="l-mail"
            name="email"
            class="vx-form-input"
            placeholder="doctor@vexavet.com"
            autocomplete="username"
            autocapitalize="none"
            required
          >
        </div>
      </div>

      <div class="vx-form-group">
        <label for="l-pass" class="vx-form-label">Contraseña</label>
        <div class="vx-input-wrapper">
          <span class="vx-input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input
            type="password"
            id="l-pass"
            name="password"
            data-ojo="1"
            class="vx-form-input has-toggle"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
          <button type="button" class="vx-toggle-pass" id="vxTogglePassBtn" aria-label="Mostrar contraseña">
            <svg id="vxEyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="vx-form-options">
        <label class="vx-remember-label">
          <input type="checkbox" id="l-rem" name="remember">
          <span>Recordar sesión</span>
        </label>
        <a href="#" class="vx-forgot-link" onclick="event.preventDefault();toast('Solicita el restablecimiento de clave al administrador de la clínica.')">¿Olvidaste tu contraseña?</a>
      </div>

      <div class="err" id="l-err" role="alert"></div>

      <button type="submit" class="vx-btn-primary" id="l-ok">
        <span>Ingresar al panel</span>
      </button>
    </form>
  </div>
</div>

<dialog id="dlg-editar">
  <form id="fe" class="simple-dlg">
    <h2>Editar usuario</h2>
    <div style="display:flex;align-items:center;gap:14px;padding:10px;background:#f8fafc;border:1px solid var(--saas-border);border-radius:10px">
      <div class="pet-ava" id="eu-ava-prev" style="width:56px;height:56px;font-size:1.2rem">U</div>
      <div style="display:grid;gap:6px">
        <input type="file" id="eu-foto-file" accept="image/jpeg,image/png,image/webp" hidden>
        <div class="fila">
          <button type="button" class="btn sm" onclick="$('eu-foto-file').click()"><i data-lucide="camera"></i> Cambiar foto</button>
          <button type="button" class="btn sm pel" id="eu-foto-del" hidden>Eliminar foto</button>
        </div>
        <span style="font-size:.75rem;color:var(--saas-muted)">JPG, PNG o WebP</span>
      </div>
    </div>
    <div><label for="e-u">Usuario</label><input id="e-u" required pattern="[a-zA-Z0-9._-]{3,30}" autocapitalize="none"></div>
    <div><label for="e-n">Nombre</label><input id="e-n" required></div>
    <div><label for="e-r">Rol</label><select id="e-r"></select></div>
    <div><label for="e-p">Nueva contraseña (opcional)</label><input id="e-p" type="password" minlength="6" autocomplete="new-password"></div>
    <p style="font-size:.82rem;color:#64748b;margin:0">Las contraseñas actuales se guardan cifradas. Si el usuario la olvidó, escribe una nueva aquí.</p>
    <div class="fila" style="justify-content:flex-end"><button type="button" class="btn" id="e-x">Cancelar</button><button class="btn pri">Guardar cambios</button></div>
  </form>
</dialog>

<dialog id="dlg-cuenta">
  <div class="dlg-head"><h3>Mi cuenta</h3><button type="button" class="btn sm" id="c-x">Cerrar</button></div>
  <div class="dlg-body">
    <div style="display:flex;align-items:center;gap:14px;padding:12px;background:#f8fafc;border:1px solid var(--saas-border);border-radius:10px;margin-bottom:14px">
      <div class="pet-ava" id="c-ava-prev" style="width:64px;height:64px;font-size:1.4rem">U</div>
      <div style="display:grid;gap:6px">
        <strong style="font-size:.9rem">Foto de perfil</strong>
        <input type="file" id="c-foto-file" accept="image/jpeg,image/png,image/webp" hidden>
        <div class="fila">
          <button type="button" class="btn sm" id="c-foto-up"><i data-lucide="camera"></i> Subir / Cambiar foto</button>
          <button type="button" class="btn sm pel" id="c-foto-del" hidden>Eliminar foto</button>
        </div>
      </div>
    </div>
    <form id="fc-n" style="display:grid;gap:10px">
      <div><label for="c-user">Usuario</label><input id="c-user" disabled></div>
      <div><label for="c-nombre">Nombre visible</label><input id="c-nombre" required disabled></div>
    </form>
    <form id="fc-p" style="margin-top:16px;border-top:1px solid #e2e8f0;padding-top:14px;display:grid;gap:10px">
      <h4>Cambiar contraseña</h4>
      <div><label for="c-act">Contraseña actual</label><input id="c-act" type="password" autocomplete="current-password" disabled></div>
      <div><label for="c-new">Nueva contraseña (mín. 6)</label><input id="c-new" type="password" autocomplete="new-password" disabled></div>
    </form>

async function resolvePetIdByNfc(uid){
  const norm = normalizeNfcUid(uid);
  if (!norm) return null;

  if (perfil && state.mascotas.length){
    const localPet = state.mascotas.find(m => getPetNfcUid(m) === norm);
    if (localPet) return localPet.id;
  }

  try {
    const { data, error } = await sb.rpc("mascota_por_nfc", { p_uid: norm });
    if (!error && data) return data;
  } catch {}

  try {
    const { data } = await sb.from("mascotas").select("id").eq("nfc_uid", norm).maybeSingle();
    if (data?.id) return data.id;
  } catch {}

  return getLocalNfcMap()[norm] || null;
}

async function handleNfcScan(rawUid){
  const uid = normalizeNfcUid(rawUid);
  if (!uid) return;

  const modalInput = $("pm-nfc-uid");
  if (modalInput && $("dlg-saas")?.open){
    const editingId = modalInput.dataset.petId || "";
    const ownerPet = state.mascotas.find(m => getPetNfcUid(m) === uid && String(m.id) !== String(editingId));
    if (ownerPet){
      toast(`Esta tarjeta ya pertenece a ${ownerPet.nombre}. Cada tarjeta es única por mascota.`, true);
      return;
    }
    modalInput.value = uid;
    const box = modalInput.closest(".full");
    if (box){
      box.style.background = "#f0fdf4";
      box.style.borderColor = "#16a34a";
    }
    toast(`Tarjeta leída (${uid}). Pulsa "Guardar Paciente" para confirmar.`);
    return;
  }

  if (perfil){
    let pet = state.mascotas.find(m => getPetNfcUid(m) === uid);
    if (!pet){
      const petId = await resolvePetIdByNfc(uid);
      if (petId) pet = state.mascotas.find(m => String(m.id) === String(petId));
    }

    if (pet){
      closeModal();
      toast(`Tarjeta NFC · Abriendo historia clínica de ${pet.nombre}`);
      navTo("historia", pet.id);
      return;
    }

    openModal({
      title: "Tarjeta NFC Nueva Detectada",
      bodyHTML: `
        <div style="display:grid;gap:12px">
          <p style="margin:0">Se leyó la tarjeta NFC con código único <span class="badge b-teal">${esc(uid)}</span>, pero todavía no está asociada a ninguna mascota.</p>
          <div>
            <label>Asignar rápidamente a una mascota existente:</label>
            <select id="nfc-assign-pet">
              <option value="">Seleccionar mascota…</option>
              ${state.mascotas.map(m => `<option value="${m.id}">${esc(m.nombre)} (${esc(m.duenio_nombre || "Sin dueño")})</option>`).join("")}
            </select>
          </div>
        </div>
      `,
      footHTML: `
        <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
        <button type="button" class="btn sec" onclick="closeModal();openMascotaModal(null,'${uid}')">Nueva Mascota</button>
        <button type="button" class="btn pri" id="nfc-assign-btn">Vincular Tarjeta</button>
      `
    });
    $("nfc-assign-btn").onclick = async () => {
      const pid = $("nfc-assign-pet").value;
      if (!pid) return toast("Selecciona una mascota de la lista.", true);
      saveLocalNfcMap(uid, pid);
      try { await db.update("mascotas", pid, { nfc_uid: uid }); } catch {}
      log("Vinculó tarjeta NFC", "mascotas", uid);
      closeModal();
      await syncAllData();
      toast("Tarjeta NFC vinculada correctamente.");
      navTo("historia", pid);
    };
    return;
  }

  const petId = await resolvePetIdByNfc(uid);
  if (petId){
    cerrarDialogLogin();
    publicId = petId;
    forzarPublico = true;
    try { history.replaceState(null, "", "?m=" + encodeURIComponent(petId)); } catch {}
    toast("Tarjeta NFC detectada · Abriendo carnet público");
    pintarPublico();
  } else {
    toast(`Tarjeta NFC (${uid}) aún no vinculada a ninguna mascota.`, true);
  }
}

function startNfcBridge(){
  if (nfcState.polling) return;
  nfcState.polling = true;

  const poll = async () => {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 2000);
      const res = await fetch(NFC_BRIDGE_URL + "?_t=" + Date.now(), { signal: ctrl.signal });
      clearTimeout(t);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const wasConnected = nfcState.connected;
      const oldReader = nfcState.reader;
      nfcState.connected = Boolean(data.ok);
      nfcState.reader = data.reader || "";
      nfcState.lastError = "";

      if (!wasConnected || oldReader !== nfcState.reader) updateNfcIndicators();

      const seq = Number(data.seq || 0);
      if (!nfcState.initialized){
        nfcState.initialized = true;
        nfcState.lastSeq = seq;
        nfcState.lastUid = data.uid || "";
      } else if (seq > nfcState.lastSeq && data.uid){
        nfcState.lastSeq = seq;
        nfcState.lastUid = data.uid;
        handleNfcScan(data.uid);
      }
    } catch (err) {
      nfcState.lastError = err?.message || "Sin conexión";
      if (nfcState.connected){
        nfcState.connected = false;
        nfcState.reader = "";
        updateNfcIndicators();
      }
    } finally {
      setTimeout(poll, 350);
    }
  };

  poll();

  let kBuf = "", kLast = 0;
  document.addEventListener("keydown", e => {
    const tag = (document.activeElement?.tagName || "").toUpperCase();
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    const now = Date.now();
    if (now - kLast > 80) kBuf = "";
    kLast = now;
    if (e.key === "Enter"){
      const clean = normalizeNfcUid(kBuf);
      kBuf = "";
      if (clean.length >= 8 && clean.length <= 20) handleNfcScan(clean);
    } else if (/^[0-9a-fA-F:]$/.test(e.key)){
      kBuf += e.key;
    }
  });
}

async function processImageFile(file, maxDim = 600, preserveAlpha = false){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bmp.width * k));
  c.height = Math.max(1, Math.round(bmp.height * k));
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const mime = preserveAlpha ? "image/png" : "image/jpeg";
  const blob = await new Promise(r => c.toBlob(r, mime, 0.86));
  const dataUrl = c.toDataURL(mime, 0.86);
  return { blob, dataUrl, mime, ext: preserveAlpha ? "png" : "jpg" };
}
async function uploadBrandingOrAvatar(file, folder, maxDim = 500, preserveAlpha = false){
  const { blob, dataUrl, mime, ext } = await processImageFile(file, maxDim, preserveAlpha);
  const ruta = `${folder}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(ruta, blob, { contentType: mime, upsert: true });
  if (!error){
    return sb.storage.from(BUCKET).getPublicUrl(ruta).data.publicUrl;
  }
  return dataUrl;
}

const missingTables = new Set();
const localStore = {
  get(t){ try { return JSON.parse(localStorage.getItem("vx_tbl_" + t) || "[]"); } catch { return []; } },
  set(t, rows){ localStorage.setItem("vx_tbl_" + t, JSON.stringify(rows)); }
};
const isMissingTableErr = err => err && (err.code === "42P01" || err.code === "PGRST205" || /relation .* does not exist|Could not find the table/i.test(err.message || ""));
const extractMissingCol = err => {
  const m = (err?.message || "").match(/Could not find the '([^']+)' column|column "([^"]+)" of relation/i);
  return m ? (m[1] || m[2]) : null;
};

const db = {
  async list(table, orderCol = "creado_en", asc = false){
    if (missingTables.has(table)) return localStore.get(table);
    let q = sb.from(table).select("*");
    if (orderCol) q = q.order(orderCol, {ascending: asc});
    const { data, error } = await q;
    if (error){
      if (isMissingTableErr(error)){ missingTables.add(table); return localStore.get(table); }
      return [];
    }
    return data || [];
  },
  async insert(table, payload){
    if (missingTables.has(table)){
      const row = {id: crypto.randomUUID(), creado_en: new Date().toISOString(), ...payload};
      const all = [row, ...localStore.get(table)]; localStore.set(table, all);
      return row;
    }
    let body = {...payload};
    for (let i = 0; i < 8; i++){
      const { data, error } = await sb.from(table).insert(body).select().single();
      if (!error) return data;
      if (isMissingTableErr(error)){
        missingTables.add(table);
        const row = {id: crypto.randomUUID(), creado_en: new Date().toISOString(), ...payload};
        localStore.set(table, [row, ...localStore.get(table)]);
        return row;
      }
      const badCol = extractMissingCol(error);
      if (badCol && badCol in body){ delete body[badCol]; continue; }
      throw error;
    }
  },
  async update(table, id, payload){
    if (missingTables.has(table)){
      const all = localStore.get(table).map(r => String(r.id) === String(id) ? {...r, ...payload} : r);
      localStore.set(table, all);
      return all.find(r => String(r.id) === String(id));
    }
    let body = {...payload};
    for (let i = 0; i < 8; i++){
      const { data, error } = await sb.from(table).update(body).eq("id", id).select().single();
      if (!error) return data;
      if (isMissingTableErr(error)){
        missingTables.add(table);
        const all = localStore.get(table).map(r => String(r.id) === String(id) ? {...r, ...payload} : r);
        localStore.set(table, all);
        return all.find(r => String(r.id) === String(id));
      }
      const badCol = extractMissingCol(error);
      if (badCol && badCol in body){ delete body[badCol]; continue; }
      throw error;
    }
  },
  async remove(table, id){
    if (missingTables.has(table)){
      localStore.set(table, localStore.get(table).filter(r => String(r.id) !== String(id)));
      return;
    }
    const { error } = await sb.from(table).delete().eq("id", id);
    if (error){
      if (isMissingTableErr(error)){
        missingTables.add(table);
        localStore.set(table, localStore.get(table).filter(r => String(r.id) !== String(id)));
        return;
      }
      throw error;
    }
  }
};

async function guardarCuenta(){
  if (!editCuenta) return;
  const n = $("c-nombre").value.trim();
  const act = $("c-act").value;
  const nw = $("c-new").value;

  if (!n) return toast("El nombre visible no puede estar vacío.", true);

  const cambioNombre = n !== perfil.nombre;
  const cambioClave = Boolean(act || nw);

  if (!cambioNombre && !cambioClave){
    modoCuenta(false);
    return toast("No se realizaron cambios.");
  }

  if (cambioClave){
    if (!act) return toast("Escribe tu contraseña actual.", true);
    if (nw.length < 6) return toast("La nueva contraseña debe tener mínimo 6 caracteres.", true);
  }

  $("c-save").disabled = true;
  $("c-ed").disabled = true;

  try {
    if (cambioNombre){
      const { error } = await sb.rpc("actualizar_mi_nombre", {p_nombre: n});
      if (error){
        toast("No se pudo guardar el nombre: " + error.message, true);
        return;
      }
      perfil.nombre = n;
      await log("Cambió su nombre", "perfiles", n);
    }

    if (cambioClave){
      const { data: { user } } = await sb.auth.getUser();
      const chk = await sb.auth.signInWithPassword({email: user.email, password: act});
      if (chk.error){
        toast("La contraseña actual no es correcta.", true);
        return;
      }
      const { error } = await sb.auth.updateUser({password: nw});
      if (error){
        toast("No se pudo cambiar la contraseña: " + error.message, true);
        return;
      }
      $("c-act").value = $("c-new").value = "";
      await log("Cambió su contraseña", "perfiles");
    }

    modoCuenta(false);
    toast("Cambios guardados correctamente.");
    render();
  } finally {
    $("c-save").disabled = false;
    $("c-ed").disabled = false;
  }
}

/* ============ ALERTAS / NOTIFICACIONES EN TIEMPO REAL ============ */
function computeAlerts(){
  const alerts = [];
  const todayStr = hoy();
  const in15 = new Date(Date.now() + 15*86400000).toISOString().slice(0,10);
  const petById = new Map(state.mascotas.map(m => [m.id, m]));

  state.vacunas.forEach(v => {
    if (v.proxima_dosis && v.proxima_dosis <= in15){
      const m = petById.get(v.mascota_id);
      alerts.push({
        type: v.proxima_dosis < todayStr ? "err" : "warn",
        cat: "Vacuna",
        title: `${m?.nombre || "Mascota"} · ${v.vacuna}`,
        desc: `${v.proxima_dosis < todayStr ? "Vencida el" : "Vence el"} ${fecha(v.proxima_dosis)}`,
        petId: v.mascota_id,
        owner: m?.duenio_nombre || "",
        phone: m?.duenio_telefono || ""
      });
    }
  });
  state.desparasitaciones.forEach(d => {
    if (d.proxima_dosis && d.proxima_dosis <= in15){
      const m = petById.get(d.mascota_id);
      alerts.push({
        type: d.proxima_dosis < todayStr ? "err" : "warn",
        cat: "Desparasitación",
        title: `${m?.nombre || "Mascota"} · ${d.producto}`,
        desc: `${d.proxima_dosis < todayStr ? "Vencida el" : "Próxima dosis"} ${fecha(d.proxima_dosis)}`,
        petId: d.mascota_id,
        owner: m?.duenio_nombre || "",
        phone: m?.duenio_telefono || ""
      });
    }
  });
  state.productos.forEach(p => {
    if (Number(p.existencias) <= Number(p.stock_minimo || 5)){
      alerts.push({
        type: "warn",
        cat: "Bajo Stock",
        title: p.nombre,
        desc: `Stock actual: ${p.existencias} (Mín: ${p.stock_minimo})`,
        route: "inventario"
      });
    }
  });
  state.citas.forEach(c => {
    if ((c.fecha_inicio || "").slice(0,10) === todayStr && c.estado !== "Cancelada" && c.estado !== "Completada"){
      alerts.push({
        type: "info",
        cat: "Cita Hoy",
        title: `${c.mascota_nombre || "Paciente"} · ${c.tipo_servicio}`,
        desc: `${fechaHora(c.fecha_inicio)} (${c.estado})`,
        route: "agenda"
      });
    }
  });
  return alerts;
}

    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && state.sidebarOpen) toggleSidebar(false);
    });
  }

  $("gs-input").oninput = e => {
    const q = e.target.value.trim().toLowerCase();
    const box = $("gs-results");
    if (!q){ box.hidden = true; return; }
    const hits = [];
    state.mascotas.filter(m => (m.nombre + " " + (m.duenio_nombre||"") + " " + (m.microchip||"") + " " + (m.nfc_uid||"")).toLowerCase().includes(q)).slice(0,5)
      .forEach(m => hits.push({ label: m.nombre, sub: `Mascota · ${m.especie} · Dueño: ${m.duenio_nombre || "—"}`, badge: m.nfc_uid ? "NFC" : "Paciente", action: () => navTo("historia", m.id) }));
    state.propietarios.filter(p => (p.nombre + " " + (p.telefono||"") + " " + (p.identificacion||"")).toLowerCase().includes(q)).slice(0,4)
      .forEach(p => hits.push({ label: p.nombre, sub: `Propietario · ${p.telefono || p.email || ""}`, badge: "Cliente", action: () => navTo("propietarios") }));
    state.productos.filter(p => (p.nombre + " " + (p.codigo||"") + " " + (p.sku||"")).toLowerCase().includes(q)).slice(0,3)
      .forEach(p => hits.push({ label: p.nombre, sub: `Stock: ${p.existencias} · ${money(p.precio_venta)}`, badge: "Producto", action: () => navTo("inventario") }));
    box.innerHTML = hits.length
      ? hits.map((h, idx) => `<div class="gs-item" data-gs="${idx}"><div><div style="font-weight:600">${esc(h.label)}</div><div style="font-size:.76rem;color:#64748b">${esc(h.sub)}</div></div><span class="badge b-teal">${h.badge}</span></div>`).join("")
      : `<div style="padding:12px;color:#64748b;font-size:.84rem">Sin coincidencias para "${esc(q)}"</div>`;
    box.hidden = false;
    box.querySelectorAll("[data-gs]").forEach(el => el.onclick = () => { box.hidden = true; hits[Number(el.dataset.gs)].action(); });
  };

  renderModule();
  icons();
}

function renderModule(){
  const routes = {
    dashboard: viewDashboard,
    agenda: viewAgenda,
    propietarios: viewPropietarios,
    mascotas: viewMascotas,
    historia: viewHistoriaClinica,
    procedimientos: viewProcedimientos,
    hospitalizacion: viewHospitalizacion,
    pos: viewPOS,
    inventario: viewInventario,
    facturacion: viewFacturacion,
    recordatorios: viewRecordatorios,
    marketing: viewMarketing,
    informes: viewInformes,
    usuarios: viewUsuarios,
    configuracion: viewConfiguracion,
    auditoria: viewAuditoria
  };
  (routes[state.route] || viewDashboard)();
}

      </div>

  `;

  $("ag-vet").onchange = e => { agendaVetFilter = e.target.value; viewAgenda(); };
  $("ag-st").onchange = e => { agendaStatusFilter = e.target.value; viewAgenda(); };

  const statusColor = st => ({
    Programada: "#2563eb",
    Confirmada: "#0d9488",
    "En sala": "#d97706",
    Completada: "#16a34a",
    Cancelada: "#94a3b8"
  }[st] || "#0d9488");

  if (window.FullCalendar){
    const cal = new FullCalendar.Calendar($("fc-calendar"), {
      initialView: "timeGridWeek",
      locale: "es",
      height: 650,
      slotMinTime: "07:00:00",
      slotMaxTime: "21:00:00",
      headerToolbar: {
        left: "prev,next today",
        center: "title",
        right: "dayGridMonth,timeGridWeek,timeGridDay,listWeek"
      },
      buttonText: { today: "Hoy", month: "Mes", week: "Semana", day: "Día", list: "Lista" },

        start: c.fecha_inicio,

    cal.render();
  }
}

function openCitaModal(cita = null, defaultStart = ""){
  const isEdit = Boolean(cita);
  const startVal = cita?.fecha_inicio ? cita.fecha_inicio.slice(0,16) : (defaultStart || new Date().toISOString().slice(0,16));
  const endVal = cita?.fecha_fin ? cita.fecha_fin.slice(0,16) : startVal;

  openModal({
    title: isEdit ? "Gestionar Cita" : "Programar Nueva Cita",
    size: "wide",
    bodyHTML: `
      <form id="f-cita" class="form-grid">
        <div>
          <label>Mascota / Paciente *</label>
          <select name="mascota_id" id="cita-pet" required>
            <option value="">Seleccionar mascota…</option>
            ${state.mascotas.map(m => `<option value="${m.id}" data-owner="${esc(m.duenio_nombre||"")}" ${cita?.mascota_id===m.id?"selected":""}>${esc(m.nombre)} (${esc(m.duenio_nombre||"Sin dueño")})</option>`).join("")}
          </select>
        </div>
        <div>
          <label>Propietario</label>
          <input name="propietario_nombre" id="cita-owner" value="${esc(cita?.propietario_nombre || "")}" placeholder="Se autocompleta al elegir mascota">
        </div>
        <div>
          <label>Tipo de Servicio *</label>
          <select name="tipo_servicio">
            ${["Consulta General","Vacunación","Desparasitación","Control / Seguimiento","Cirugía","Peluquería / Baño","Laboratorio / Ecografía","Urgencia"].map(s => `<option ${cita?.tipo_servicio===s?"selected":""}>${s}</option>`).join("")}
          </select>
        </div>
        <div>
          <label>Veterinario Responsable</label>
          <input name="veterinario_nombre" value="${esc(cita?.veterinario_nombre || perfil.nombre)}" list="dl-vets">
          <datalist id="dl-vets">${state.perfiles.map(p => `<option value="${esc(p.nombre)}">`).join("")}</datalist>
        </div>
        <div>
          <label>Inicio *</label>
          <input type="datetime-local" name="fecha_inicio" value="${startVal}" required>
        </div>
        <div>
          <label>Fin *</label>
          <input type="datetime-local" name="fecha_fin" value="${endVal}" required>
        </div>
        <div>
          <label>Estado</label>
          <select name="estado">
            ${["Programada","Confirmada","En sala","Completada","Cancelada"].map(s => `<option ${cita?.estado===s?"selected":""}>${s}</option>`).join("")}
          </select>
        </div>
        <div class="full"><label>Observaciones</label><textarea name="observaciones">${esc(cita?.observaciones || "")}</textarea></div>
      </form>
    `,
    footHTML: `
      ${isEdit && cita.mascota_id ? `<button type="button" class="btn sec" onclick="closeModal();openConsultaModal('${cita.mascota_id}')">Iniciar Consulta</button>` : ""}
      ${isEdit ? `<button type="button" class="btn pel" id="del-cita">Eliminar</button>` : ""}
      <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
      <button type="submit" form="f-cita" class="btn pri">Guardar Cita</button>
    `
  });

  $("cita-pet").onchange = e => {
    const opt = e.target.selectedOptions[0];
    if (opt && opt.dataset.owner) $("cita-owner").value = opt.dataset.owner;
  };

  if (isEdit && $("del-cita")){
    $("del-cita").onclick = async () => {
      if (!confirm("¿Eliminar esta cita?")) return;
      await db.remove("citas", cita.id);
      log("Eliminó cita", "citas", cita.mascota_nombre);
      closeModal(); await syncAllData(); renderSaas(); toast("Cita eliminada.");
    };
  }

  $("f-cita").onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const pet = state.mascotas.find(m => m.id === fd.get("mascota_id"));
    const payload = {
      mascota_id: fd.get("mascota_id") || null,
      mascota_nombre: pet ? pet.nombre : "Paciente",
      propietario_nombre: fd.get("propietario_nombre").trim() || pet?.duenio_nombre || "",
      tipo_servicio: fd.get("tipo_servicio"),
      veterinario_nombre: fd.get("veterinario_nombre").trim(),
      fecha_inicio: new Date(fd.get("fecha_inicio")).toISOString(),
      fecha_fin: new Date(fd.get("fecha_fin")).toISOString(),
      estado: fd.get("estado"),
      observaciones: fd.get("observaciones").trim()
    };
    if (isEdit) await db.update("citas", cita.id, payload);
    else await db.insert("citas", payload);
    log(isEdit ? "Actualizó cita" : "Agendó cita", "citas", payload.mascota_nombre);
    closeModal(); await syncAllData(); renderSaas(); toast("Cita guardada correctamente.");
  };
}

function openOwnerModal(id = null){
  const p = id ? state.propietarios.find(x => String(x.id) === String(id)) : null;
  const isEdit = Boolean(p && !p._legacy);
  openModal({
    title: isEdit ? "Editar Propietario" : "Registrar Propietario",
    bodyHTML: `
      <form id="f-owner" class="form-grid">
        <div class="full"><label>Nombre Completo *</label><input name="nombre" value="${esc(p?.nombre || "")}" required></div>
        <div><label>Identificación / Cédula / RUC</label><input name="identificacion" value="${esc(p?.identificacion || "")}"></div>
        <div><label>Teléfono / WhatsApp</label><input name="telefono" value="${esc(p?.telefono || "")}"></div>
        <div><label>Correo Electrónico</label><input type="email" name="email" value="${esc(p?.email || "")}"></div>
        <div><label>Dirección</label><input name="direccion" value="${esc(p?.direccion || "")}"></div>
        <div class="full"><label>Observaciones</label><textarea name="observaciones">${esc(p?.observaciones || "")}</textarea></div>
      </form>
    `,
    footHTML: `<button type="button" class="btn" onclick="closeModal()">Cancelar</button><button type="submit" form="f-owner" class="btn pri">Guardar Propietario</button>`
  });
  $("f-owner").onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {
      nombre: fd.get("nombre").trim(),
      identificacion: fd.get("identificacion").trim() || null,
      telefono: fd.get("telefono").trim() || null,
      email: fd.get("email").trim() || null,
      direccion: fd.get("direccion").trim() || null,
      observaciones: fd.get("observaciones").trim() || null
    };

    closeModal(); await syncAllData(); renderSaas(); toast("Propietario guardado.");
  };
}

async function deleteOwner(id){
  if (!confirm("¿Eliminar este propietario?")) return;
  await db.remove("propietarios", id);
  log("Eliminó propietario", "propietarios", id);
  await syncAllData(); renderSaas(); toast("Propietario eliminado.");
}

async function copyPublicLink(id){
  try { await navigator.clipboard.writeText(enlace(id)); toast("Enlace público del carnet copiado."); }
  catch { prompt("Copia el enlace público:", enlace(id)); }
}

let modalFotoBlob = null;
function openMascotaModal(id = null, prefillNfc = ""){
  modalFotoBlob = null;
  const m = id ? state.mascotas.find(x => x.id === id) : null;
  const isEdit = Boolean(m);
  const currentNfc = prefillNfc ? normalizeNfcUid(prefillNfc) : getPetNfcUid(m);

  openModal({
    title: isEdit ? `Editar Paciente · ${m.nombre}` : "Registrar Nueva Mascota",
    size: "wide",
    bodyHTML: `
      <form id="f-pet" class="form-grid">
        <div class="full" style="display:flex;align-items:center;gap:14px;padding-bottom:8px;border-bottom:1px solid #f1f5f9">
          <div class="pet-ava" id="pm-preview" style="width:64px;height:64px">${avatarHTML(m?.foto_url, m?.nombre || "M")}</div>
          <div>
            <input type="file" id="pm-file" accept="image/jpeg,image/png,image/webp" hidden>
            <button type="button" class="btn sm" onclick="$('pm-file').click()"><i data-lucide="camera"></i> Subir fotografía</button>
            <div style="font-size:.76rem;color:#64748b;margin-top:4px">JPG, PNG o WebP (se optimiza automáticamente)</div>
          </div>
        </div>
        <div><label>Nombre *</label><input name="nombre" value="${esc(m?.nombre || "")}" required></div>
        <div><label>Especie *</label><select name="especie">${["Perro","Gato","Ave","Conejo","Roedor","Reptil","Otra"].map(s => `<option ${m?.especie===s?"selected":""}>${s}</option>`).join("")}</select></div>
        <div><label>Raza</label><input name="raza" value="${esc(m?.raza || "")}"></div>
        <div><label>Sexo</label><select name="sexo"><option value="">—</option><option ${m?.sexo==="Macho"?"selected":""}>Macho</option><option ${m?.sexo==="Hembra"?"selected":""}>Hembra</option></select></div>
        <div><label>Fecha de nacimiento</label><input type="date" name="fecha_nacimiento" value="${m?.fecha_nacimiento || ""}"></div>
        <div><label>Peso (kg)</label><input type="number" step="0.01" min="0" name="peso_kg" value="${m?.peso_kg ?? ""}"></div>
        <div><label>Color</label><input name="color" value="${esc(m?.color || "")}"></div>
        <div><label>Microchip</label><input name="microchip" value="${esc(m?.microchip || "")}"></div>
        <div class="full" style="padding:10px 12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px">
          <label for="pm-nfc-uid"><i data-lucide="nfc" style="width:14px;height:14px;vertical-align:-2px;color:#0d9488"></i> Tarjeta NFC Asignada (Única por mascota)</label>
          <div class="fila" style="margin-top:4px">
            <input name="nfc_uid" id="pm-nfc-uid" data-pet-id="${esc(m?.id || "")}" value="${esc(currentNfc)}" placeholder="Acerca la tarjeta al lector ACR122U o escribe su UID…" style="flex:1;font-family:monospace;text-transform:uppercase">
            <button type="button" class="btn sm sec" onclick="toast('Acerca la tarjeta NFC al lector ACR122U ahora…')"><i data-lucide="radio"></i> Esperando lectura</button>
            <button type="button" class="btn sm" onclick="$('pm-nfc-uid').value=''">Limpiar</button>
          </div>
          <div style="font-size:.75rem;color:#64748b;margin-top:4px">Con esta ventana abierta, apoya la tarjeta sobre el lector ACR122U-A9 para capturar su código y luego pulsa <strong>Guardar Paciente</strong>.</div>
        </div>
        <div><label>Estado reproductivo</label><select name="estado_reproductivo"><option value="">—</option>${["Entero/a","Esterilizado/a","Gestante","Lactante"].map(s => `<option ${m?.estado_reproductivo===s?"selected":""}>${s}</option>`).join("")}</select></div>
        <div style="display:flex;gap:16px;align-items:center;padding-top:20px">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" name="esterilizado" style="width:18px;min-height:0" ${m?.esterilizado?"checked":""}> Esterilizado</label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" name="vacunas_al_dia" style="width:18px;min-height:0" ${m?.vacunas_al_dia?"checked":""}> Vacunas al día</label>
        </div>
        <div class="full"><label>Alergias conocidas</label><input name="alergias" value="${esc(m?.alergias || "")}" placeholder="Ej. Penicilina, pollo, picadura de pulga…"></div>
        <div class="full"><label>Antecedentes médicos</label><textarea name="antecedentes">${esc(m?.antecedentes || "")}</textarea></div>
        <div>
          <label>Propietario · Nombre</label>
          <input name="duenio_nombre" id="pm-owner" value="${esc(m?.duenio_nombre || "")}" list="dl-owners" placeholder="Escribe o selecciona un cliente">
          <datalist id="dl-owners">${state.propietarios.map(p => `<option value="${esc(p.nombre)}">`).join("")}</datalist>
        </div>
        <div><label>Propietario · Teléfono</label><input name="duenio_telefono" id="pm-tel" value="${esc(m?.duenio_telefono || "")}"></div>
        <div><label>Propietario · Correo</label><input type="email" name="duenio_email" id="pm-mail" value="${esc(m?.duenio_email || "")}"></div>
        <div><label>Propietario · Dirección</label><input name="duenio_direccion" id="pm-dir" value="${esc(m?.duenio_direccion || "")}"></div>
        <div class="full"><label>Observaciones generales</label><textarea name="notas">${esc(m?.notas || "")}</textarea></div>
      </form>
    `,
    footHTML: `
      ${isEdit && isAdmin() ? `<button type="button" class="btn pel" onclick="closeModal();deleteMascota('${m.id}')">Eliminar</button>` : ""}
      <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
      <button type="submit" form="f-pet" class="btn pri" id="pm-save">Guardar Paciente</button>
    `
  });

  $("pm-owner").onchange = e => {
    const p = state.propietarios.find(x => (x.nombre||"").toLowerCase() === e.target.value.trim().toLowerCase());
    if (p){
      if (p.telefono) $("pm-tel").value = p.telefono;
      if (p.email) $("pm-mail").value = p.email;
      if (p.direccion) $("pm-dir").value = p.direccion;
    }
  };

  $("pm-file").onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const bmp = await createImageBitmap(f);
      const k = Math.min(1, 800 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      modalFotoBlob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
      $("pm-preview").innerHTML = `<img src="${URL.createObjectURL(modalFotoBlob)}">`;
    } catch { toast("No se pudo procesar la imagen.", true); }
  };

  $("f-pet").onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const nfcUid = normalizeNfcUid(fd.get("nfc_uid"));

    if (nfcUid){
      const dup = state.mascotas.find(x => getPetNfcUid(x) === nfcUid && (!isEdit || String(x.id) !== String(m.id)));
      if (dup){
        return toast(`La tarjeta NFC (${nfcUid}) ya está asignada a ${dup.nombre}.`, true);
      }
    }

    $("pm-save").disabled = true;
    const payload = {
      nombre: fd.get("nombre").trim(),
      especie: fd.get("especie"),
      raza: fd.get("raza").trim() || null,
      sexo: fd.get("sexo") || null,
      fecha_nacimiento: fd.get("fecha_nacimiento") || null,
      peso_kg: fd.get("peso_kg") ? Number(fd.get("peso_kg")) : null,
      color: fd.get("color").trim() || null,
      microchip: fd.get("microchip").trim() || null,
      nfc_uid: nfcUid || null,
      estado_reproductivo: fd.get("estado_reproductivo") || null,
      esterilizado: fd.get("esterilizado") === "on",
      vacunas_al_dia: fd.get("vacunas_al_dia") === "on",
      alergias: fd.get("alergias").trim() || null,
      antecedentes: fd.get("antecedentes").trim() || null,
      duenio_nombre: fd.get("duenio_nombre").trim() || null,
      duenio_telefono: fd.get("duenio_telefono").trim() || null,
      duenio_email: fd.get("duenio_email").trim() || null,
      duenio_direccion: fd.get("duenio_direccion").trim() || null,
      notas: fd.get("notas").trim() || null
    };

    try {
      if (modalFotoBlob){
        const ruta = crypto.randomUUID() + ".jpg";
        const { error } = await sb.storage.from(BUCKET).upload(ruta, modalFotoBlob, {contentType: "image/jpeg"});
        if (!error) payload.foto_url = sb.storage.from(BUCKET).getPublicUrl(ruta).data.publicUrl;
      }
      if (isEdit){
        payload.actualizado_en = new Date().toISOString();
        await db.update("mascotas", m.id, payload);
        saveLocalNfcMap(nfcUid, m.id);
        state.selectedPetId = m.id;
      } else {
        const created = await db.insert("mascotas", payload);
        if (created?.id){
          saveLocalNfcMap(nfcUid, created.id);
          state.selectedPetId = created.id;
        }
      }
      log(isEdit ? "Editó mascota" : "Creó mascota", "mascotas", payload.nombre);
      closeModal(); await syncAllData(); renderSaas(); toast("Paciente guardado.");
    } catch (err) {
      toast("Error al guardar: " + err.message, true);
      $("pm-save").disabled = false;
    }
  };
}

async function deleteMascota(id){
  const m = state.mascotas.find(x => x.id === id);
  if (!m || !confirm(`¿Eliminar definitivamente a ${m.nombre} y todo su historial clínico?`)) return;
  saveLocalNfcMap("", id);
  await db.remove("mascotas", id);
  log("Eliminó mascota", "mascotas", m.nombre);
  if (state.selectedPetId === id) state.selectedPetId = null;
  await syncAllData(); renderSaas(); toast("Mascota eliminada.");
}

/* ============ 5. HISTORIA CLÍNICA COMPLETA ============ */
function viewHistoriaClinica(){
  if (!state.mascotas.length){
    $("workspace").innerHTML = `<div class="card"><div class="card-body" style="text-align:center;padding:40px">
      <h3>Aún no hay mascotas registradas</h3>

      <button class="btn pri" onclick="openMascotaModal()">Registrar Mascota</button>
    </div></div>`;
    return;
  }
  const m = state.mascotas.find(x => x.id === state.selectedPetId) || state.mascotas[0];
  state.selectedPetId = m.id;
  const nfcUid = getPetNfcUid(m);

  const consultas = state.consultas.filter(x => x.mascota_id === m.id);
  const vacunas = state.vacunas.filter(x => x.mascota_id === m.id);
  const desparasitaciones = state.desparasitaciones.filter(x => x.mascota_id === m.id);
  const medicacion = state.medicacion.filter(x => x.mascota_id === m.id);
  const examenes = state.examenes.filter(x => x.mascota_id === m.id);
  const cirugias = state.cirugias.filter(x => x.mascota_id === m.id);

    ...medicacion.map(rx => ({ date: rx.fecha_inicio, type: "Fórmula Médica", color: "#7c3aed", title: `${rx.medicamento} ${rx.concentracion || ""}`, sub: `Dosis: ${rx.dosis || "—"} · Frecuencia: ${rx.frecuencia || "—"} · Vía: ${rx.via_administracion || "—"}`, meta: rx.indicaciones || "" })),

async function delClinItem(table, id){
  if (!confirm("¿Eliminar este registro clínico?")) return;
  await db.remove(table, id);
  log("Eliminó registro clínico", table, id);
  await syncAllData(); renderSaas(); toast("Registro eliminado.");
}

function openConsultaModal(petId = null){
  const targetPet = petId || state.selectedPetId || state.mascotas[0]?.id || "";
  openModal({
    title: "Registrar Consulta Veterinaria",
    size: "wide",
    bodyHTML: `
      <form id="f-cons" class="form-grid">
        <div>
          <label>Paciente *</label>
          <select name="mascota_id" required>
            ${state.mascotas.map(m => `<option value="${m.id}" ${m.id===targetPet?"selected":""}>${esc(m.nombre)} (${esc(m.duenio_nombre||"")})</option>`).join("")}
          </select>
        </div>
        <div><label>Fecha *</label><input type="date" name="fecha" value="${hoy()}" required></div>
        <div class="full"><label>Motivo de Consulta *</label><input name="motivo" required placeholder="Ej. Decaimiento, control anual, vómitos…"></div>
        <div><label>Anamnesis</label><textarea name="anamnesis" placeholder="Historia previa relatada por el tutor…"></textarea></div>
        <div><label>Síntomas observados</label><textarea name="sintomas"></textarea></div>
        <div class="full"><label>Examen Físico</label><textarea name="examen_fisico" placeholder="Mucosas, hidratación, palpación, auscultación…"></textarea></div>
        <div><label>Temperatura (°C)</label><input type="number" step="0.1" name="temperatura_c" placeholder="38.5"></div>
        <div><label>Peso (kg)</label><input type="number" step="0.01" name="peso_kg"></div>
        <div><label>Frecuencia Cardíaca (lpm)</label><input type="number" name="frecuencia_cardiaca"></div>
        <div><label>Frecuencia Respiratoria (rpm)</label><input type="number" name="frecuencia_respiratoria"></div>
        <div class="full"><label>Diagnóstico</label><input name="diagnostico"></div>
        <div class="full"><label>Tratamiento</label><textarea name="tratamiento"></textarea></div>
        <div><label>Recomendaciones</label><textarea name="recomendaciones"></textarea></div>
        <div><label>Observaciones / Médico Responsable</label><input name="veterinario" value="${esc(perfil.nombre)}"></div>
      </form>
    `,
    footHTML: `<button type="button" class="btn" onclick="closeModal()">Cancelar</button><button type="submit" form="f-cons" class="btn pri">Guardar Consulta</button>`
  });

  $("f-cons").onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {
      mascota_id: fd.get("mascota_id"),
      fecha: fd.get("fecha"),
      motivo: fd.get("motivo").trim(),
      anamnesis: fd.get("anamnesis").trim() || null,
      sintomas: fd.get("sintomas").trim() || null,
      examen_fisico: fd.get("examen_fisico").trim() || null,
      temperatura_c: fd.get("temperatura_c") ? Number(fd.get("temperatura_c")) : null,
      peso_kg: fd.get("peso_kg") ? Number(fd.get("peso_kg")) : null,
      frecuencia_cardiaca: fd.get("frecuencia_cardiaca") ? Number(fd.get("frecuencia_cardiaca")) : null,
      frecuencia_respiratoria: fd.get("frecuencia_respiratoria") ? Number(fd.get("frecuencia_respiratoria")) : null,
      diagnostico: fd.get("diagnostico").trim() || null,
      tratamiento: fd.get("tratamiento").trim() || null,
      recomendaciones: fd.get("recomendaciones").trim() || null,
      veterinario: fd.get("veterinario").trim() || perfil.nombre
    };
    await db.insert("consultas", payload);
    if (payload.peso_kg){
      await db.update("mascotas", payload.mascota_id, {peso_kg: payload.peso_kg});
    }
    state.selectedPetId = payload.mascota_id;
    log("Registró consulta", "consultas", payload.motivo);
    closeModal(); await syncAllData(); renderSaas(); toast("Consulta guardada en historia clínica.");
  };
}

    }

  openModal({
    title: cfg.title,
    size: "wide",
    bodyHTML: `<form id="f-clin" class="form-grid">
      ${cfg.fields.map(([k,l,t,req,def,opts]) => `
        <div class="${t==="textarea"?"full":""}">
          <label>${l}</label>
          ${t==="textarea" ? `<textarea name="${k}" ${req?"required":""}>${esc(def||"")}</textarea>`
            : t==="select" ? `<select name="${k}">${opts.map(o => `<option>${o}</option>`).join("")}</select>`
            : `<input type="${t}" name="${k}" value="${esc(def||"")}" ${req?"required":""} ${t==="number"?'step="0.01"':""}>`}
        </div>
      `).join("")}
    </form>`,
    footHTML: `<button type="button" class="btn" onclick="closeModal()">Cancelar</button><button type="submit" form="f-clin" class="btn pri">Guardar Registro</button>`
  });

  $("f-clin").onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = { mascota_id: petId };
    cfg.fields.forEach(([k,,t]) => {
      const v = (fd.get(k) || "").trim();
      payload[k] = v === "" ? null : t === "number" ? Number(v) : v;
    });
    await db.insert(table, payload);
    if (table === "vacunas") await db.update("mascotas", petId, {vacunas_al_dia: true});
    log("Agregó registro clínico", table, payload.vacuna || payload.producto || payload.medicamento || payload.tipo || payload.titulo);
    closeModal(); await syncAllData(); renderSaas(); toast("Registro guardado.");
  };
}

function addToCart(kind, id){
  const source = kind === "producto"
    ? state.productos.find(p => String(p.id) === String(id))
    : state.procedimientos.find(s => String(s.id) === String(id));
  if (!source) return;
  const existing = state.cart.find(c => c.kind === kind && String(c.id) === String(id));
  if (existing) existing.qty += 1;
  else state.cart.push({ kind, id, name: source.nombre, price: Number(kind === "producto" ? source.precio_venta : source.precio), qty: 1 });
  viewPOS();
}
function updCartQty(idx, delta){
  state.cart[idx].qty += delta;
  if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
  viewPOS();
}

async function checkoutPOS(){
  if (!state.cart.length) return toast("El carrito está vacío.", true);
  const taxPct = Number(state.config.impuesto_porcentaje || 0);
  const subtotal = state.cart.reduce((s, it) => s + (it.price * it.qty), 0);
  const iva = subtotal * (taxPct / 100);
  const total = subtotal + iva;
  const numVenta = "FAC-" + String(Date.now()).slice(-6);
  const petId = $("pos-pet").value || null;
  const pet = state.mascotas.find(m => m.id === petId);

  const sale = await db.insert("ventas", {
    numero_venta: numVenta,
    cliente_nombre: $("pos-client").value.trim() || pet?.duenio_nombre || "Consumidor Final",
    mascota_id: petId,
    mascota_nombre: pet?.nombre || null,
    items: state.cart,
    subtotal,
    impuesto: iva,
    total,
    metodo_pago: $("pos-pay").value,
    estado_pago: "Pagada",
    cajero: perfil.nombre
  });

  for (const it of state.cart){
    if (it.kind === "producto"){
      const prod = state.productos.find(p => String(p.id) === String(it.id));
      if (prod){
        const nuevoStock = Math.max(0, Number(prod.existencias || 0) - it.qty);
        await db.update("productos", prod.id, { existencias: nuevoStock });
        await db.insert("movimientos_inventario", {
          producto_id: prod.id,
          producto_nombre: prod.nombre,
          tipo: "Salida (Venta)",
          cantidad: it.qty,
          motivo: `Venta ${numVenta}`,
          usuario: perfil.nombre
        });
      }
    }
  }

  state.cart = [];
  log("Registró venta POS", "ventas", `${numVenta} (${money(total)})`);
  await syncAllData(); renderSaas(); toast(`Venta ${numVenta} registrada correctamente.`);
  if (sale) showFacturaModal(sale);
}

function exportVentasCSV(){
  const rows = [["Numero","Fecha","Cliente","Mascota","Metodo","Subtotal","Impuesto","Total","Estado"]];
  state.ventas.forEach(v => rows.push([v.numero_venta, v.creado_en, v.cliente_nombre, v.mascota_nombre||"", v.metodo_pago, v.subtotal, v.impuesto, v.total, v.estado_pago]));
  const csv = rows.map(r => r.map(x => `"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = `vexavet_ventas_${hoy()}.csv`;
  a.click();
}

      payMap[m] = (payMap[m] || 0) + Number(v.total || 0);
    });
    repCharts.push(new Chart($("rep-pay-chart"), {
      type: "pie",
      data: {
        labels: Object.keys(payMap).length ? Object.keys(payMap) : ["Sin ventas"],

    repCharts.push(new Chart($("rep-srv-chart"), {
      type: "bar",

  if ($("e-p").value) payload.p_password = $("e-p").value;

  await syncAllData(); renderSaas();
}
async function deleteUser(id, nombre){

  await syncAllData(); renderSaas(); toast("Usuario eliminado.");
}

    renderSaas();
