<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEXAVET | Carnet Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fondo:#e9f0ee;--panel:#fff;--tinta:#13302b;--suave:#5b726c;--linea:#cfdcd8;--pri:#0f6b62;--pri2:#0a4f48;--aviso:#e7a21c;--peligro:#b3261e;--ro:#f3f7f6;--r:10px}
@media (prefers-color-scheme:dark){:root{--fondo:#0e1a18;--panel:#152522;--tinta:#e6f1ee;--suave:#93aba5;--linea:#2a403b;--pri:#3fb5a8;--pri2:#6fd0c5;--ro:#1a2d29;--peligro:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font:400 16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0;letter-spacing:-.01em}
.app{max-width:1120px;margin:0 auto;padding:16px 16px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.marca{font:700 1.5rem "Bricolage Grotesque",sans-serif;color:var(--tinta);text-decoration:none}
.marca small{font:400 .85rem Figtree;color:var(--suave);margin-left:8px}
#nav,#sesion,.fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:.85rem;color:var(--suave)}
.panel{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r)}
.pad{padding:24px}
.layout{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
.lista{padding:14px}.lista-cab{display:flex;gap:8px;margin-bottom:10px}.lista-cab input{flex:1;min-width:0}
#lista{list-style:none;margin:0;padding:0;max-height:64vh;overflow:auto}
#lista button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;cursor:pointer}
#lista button:hover{background:var(--ro)}
#lista button[aria-current=true]{background:var(--pri);color:#fff}
#lista .n{font-weight:600;display:block}#lista .s{font-size:.8rem;opacity:.75}
.mini,.avatar{flex:none;border-radius:50%;overflow:hidden;background:var(--ro);color:var(--pri);display:grid;place-items:center;font:700 1rem "Bricolage Grotesque",sans-serif}
.mini{width:40px;height:40px}.avatar{width:92px;height:92px;font-size:2.2rem;border:2px solid var(--linea)}
.mini img,.avatar img{width:100%;height:100%;object-fit:cover}
.vacio{color:var(--suave);padding:14px;font-size:.92rem}
.det{padding:20px;min-width:0}
.cab{display:flex;gap:16px;align-items:center;margin-bottom:14px}.cab-t{display:grid;gap:8px;min-width:0}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--linea);margin-bottom:16px}
button.tab{font:500 .92rem Figtree;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;color:var(--suave);cursor:pointer;white-space:nowrap}
button.tab[aria-current=true]{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}.full{grid-column:1/-1}
label{display:block;font-size:.86rem;font-weight:500;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--linea);border-radius:8px;padding:9px 11px;min-height:42px}
textarea{min-height:84px;resize:vertical}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled input,fieldset:disabled select,fieldset:disabled textarea{background:var(--ro);border-color:transparent;appearance:none}
.check{display:flex;align-items:center;gap:10px}.check input{width:20px;height:20px;min-height:0;accent-color:var(--pri)}.check label{margin:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn{font:600 .92rem Figtree,sans-serif;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--linea);background:var(--panel);color:var(--tinta);cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
.btn:hover{border-color:var(--pri)}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.btn.pel{color:var(--peligro);border-color:var(--peligro);background:transparent}.btn[disabled]{opacity:.5;cursor:not-allowed}
.acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--linea)}.esp{flex:1}
.tabla{overflow-x:auto;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--linea);vertical-align:top}th{color:var(--suave);font-weight:500;white-space:nowrap}
.venc{color:var(--peligro);font-weight:600}
details{margin-top:6px}summary{list-style:none;display:inline-flex}summary::-webkit-details-marker{display:none}
details form{margin-top:12px}
.pub{max-width:640px;margin:0 auto;padding:24px}.pub .avatar{width:120px;height:120px;font-size:3rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:16px 0}dt{color:var(--suave)}dd{margin:0}
.ok{color:var(--pri);font-weight:600}
.clave{position:relative}.clave input{padding-right:88px}
.ojo{position:absolute;right:4px;top:50%;transform:translateY(-50%);min-height:32px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--pri);font:600 .85rem Figtree,sans-serif;cursor:pointer}
.ojo:hover{background:var(--ro)}
dialog{border:1px solid var(--linea);border-radius:var(--r);background:var(--panel);color:var(--tinta);padding:24px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog form{display:grid;gap:12px}
.err{color:var(--peligro);font-size:.9rem;min-height:1.2em}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tinta);color:var(--panel);padding:11px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:10}
#toast.ver{opacity:1}#toast.error{background:var(--peligro);color:#fff}
@media (max-width:820px){.layout{grid-template-columns:1fr}#lista{max-height:220px}}
@media (max-width:520px){.grid{grid-template-columns:1fr}.det{padding:14px}.avatar{width:72px;height:72px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="marca" href="./">VEXAVET<small>Carnet digital</small></a>
    <nav id="nav" aria-label="Secciones"></nav>
    <div id="sesion"></div>
  </header>
  <main id="app"></main>
</div>

<dialog id="dlg">
  <form id="fl">
    <h2>Iniciar sesión</h2>
    <div><label for="l-mail">Usuario</label><input id="l-mail" autocomplete="username" autocapitalize="none" required></div>
    <div><label for="l-pass">Contraseña</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
    <div class="err" id="l-err" role="alert"></div>
    <div class="fila"><button class="btn pri" id="l-ok">Entrar</button><button type="button" class="btn" id="l-x">Cancelar</button></div>
  </form>
</dialog>
<dialog id="dlg-cuenta">
  <h2>Mi cuenta</h2>
  <form id="fc-n" style="margin-top:12px">
    <div><label for="c-user">Usuario (no se puede cambiar)</label><input id="c-user" disabled></div>
    <div><label for="c-nombre">Nombre</label><input id="c-nombre" required></div>
    <button class="btn pri">Guardar nombre</button>
  </form>
  <form id="fc-p" style="margin-top:18px;border-top:1px solid var(--linea);padding-top:16px">
    <h3>Cambiar contraseña</h3>
    <div><label for="c-act">Contraseña actual</label><input id="c-act" type="password" autocomplete="current-password" required></div>
    <div><label for="c-new">Nueva contraseña (mín. 6)</label><input id="c-new" type="password" minlength="6" autocomplete="new-password" required></div>
    <button class="btn pri">Cambiar contraseña</button>
  </form>
  <div class="fila" style="margin-top:16px"><button type="button" class="btn" id="c-x">Cerrar</button></div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============ CONFIGURACIÓN ============ */
const SUPABASE_URL = "https://ygszxwuyausdpmpejpwu.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlnc3p4d3V5YXVzZHBtcGVqcHd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NTU3MzAsImV4cCI6MjEwNjQzMTczMH0.F4QkVCP_kbiOLGFr0UzaLQrsBbgGVF-7e6mL3tNcC90";
const ROL_ADMIN = "administrador", ROL_VET = "veterinario";   // deben coincidir con la columna perfiles.rol
/* ======================================= */
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BUCKET = "fotos-mascotas";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fecha = d => d ? new Date(d.length > 10 ? d : d + "T00:00:00").toLocaleDateString("es-EC") : "—";
const hoy = () => new Date().toISOString().slice(0, 10);
const params = new URLSearchParams(location.search);
let publicId = params.get("m"), forzarPublico = params.get("vista") === "publica";
const enlace = id => location.origin + location.pathname + "?m=" + id;
const isAdmin = () => perfil?.rol === ROL_ADMIN;

let perfil = null, mascotas = [], selId = null, tab = "datos", vista = "mascotas", nueva = false, editando = false;
let fotoArchivo = null, fotoPrev = null, fotoQuitada = false;

const CAMPOS = [
  ["nombre","Nombre *","text"],["especie","Especie","sel",["Perro","Gato","Ave","Conejo","Roedor","Reptil","Otra"]],
  ["raza","Raza","text"],["sexo","Sexo","sel",["","Macho","Hembra"]],
  ["fecha_nacimiento","Fecha de nacimiento","date"],["peso_kg","Peso (kg)","number"],
  ["color","Color","text"],["microchip","Microchip","text"],
  ["esterilizado","Esterilizado","check"],["vacunas_al_dia","Vacunas al día","check"],
  ["alergias","Alergias","text"],["duenio_nombre","Dueño · nombre","text"],["duenio_telefono","Dueño · teléfono","tel"],
  ["duenio_email","Dueño · correo","email"],["duenio_direccion","Dueño · dirección","text"],["notas","Observaciones","area"]
];
const CLIN = {
  vacunas:{t:"Vacunas",o:"fecha",c:[["vacuna","Vacuna","text",1],["fecha","Fecha","date",1],["proxima_dosis","Próxima dosis","date"],["lote","Lote","text"],["veterinario","Veterinario","text"]]},
  consultas:{t:"Consultas",o:"fecha",c:[["fecha","Fecha","date",1],["motivo","Motivo","text",1],["diagnostico","Diagnóstico","text"],["tratamiento","Tratamiento","text"],["temperatura_c","Temp. °C","number"],["frecuencia_cardiaca","FC (lpm)","number"],["peso_kg","Peso kg","number"],["veterinario","Veterinario","text"]]},
  desparasitaciones:{t:"Desparasitación",o:"fecha",c:[["tipo","Tipo","text",1],["producto","Producto","text",1],["fecha","Fecha","date",1],["proxima_dosis","Próxima dosis","date"],["peso_kg","Peso kg","number"]]},
  cirugias:{t:"Cirugías",o:"fecha",c:[["fecha","Fecha","date",1],["procedimiento","Procedimiento","text",1],["anestesia","Anestesia","text"],["veterinario","Veterinario","text"],["observaciones","Observaciones","text"]]},
  examenes:{t:"Exámenes",o:"fecha",c:[["fecha","Fecha","date",1],["tipo","Tipo","text",1],["laboratorio","Laboratorio","text"],["resultado","Resultado","text"]]},
  medicacion:{t:"Medicación",o:"fecha_inicio",c:[["medicamento","Medicamento","text",1],["dosis","Dosis","text"],["frecuencia","Frecuencia","text"],["fecha_inicio","Inicio","date",1],["fecha_fin","Fin","date"],["indicaciones","Indicaciones","text"]]}
};

function toast(msg, error = false){
  const t = $("toast"); t.textContent = msg; t.className = "ver" + (error ? " error" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "", 3200);
}
async function log(accion, entidad, detalle){
  if (!perfil) return;
  await sb.from("registro_actividad").insert({usuario_id: perfil.id, usuario_email: perfil.usuario || perfil.email, accion, entidad: entidad || null, detalle: detalle || null});
}
const avatarHTML = (url, nombre) => url ? `<img src="${esc(url)}" alt="Foto de ${esc(nombre)}">` : esc((nombre || "?")[0].toUpperCase());
const edad = f => { if (!f) return "—"; const d = new Date(f), n = new Date(); let m = (n.getFullYear() - d.getFullYear()) * 12 + n.getMonth() - d.getMonth(); if (n.getDate() < d.getDate()) m--; return m >= 12 ? Math.floor(m / 12) + " años" + (m % 12 ? " " + (m % 12) + " m" : "") : m + " meses"; };

/* ---------- Sesión ---------- */
async function cargarPerfil(u){
  const { data } = await sb.from("perfiles").select("*").eq("id", u.id).maybeSingle();
  if (!data || !data.activo){ await sb.auth.signOut(); perfil = null; return data ? "bloqueado" : "sinperfil"; }
  perfil = data; return null;
}
$("fl").addEventListener("submit", async e => {
  e.preventDefault(); $("l-err").textContent = ""; $("l-ok").disabled = true;
  const { data: email } = await sb.rpc("email_por_usuario", {p_usuario: $("l-mail").value});
  const { data, error } = email ? await sb.auth.signInWithPassword({email, password: $("l-pass").value}) : {error: true};
  if (error){ $("l-err").textContent = "Usuario o contraseña incorrectos."; $("l-ok").disabled = false; return; }
  const r = await cargarPerfil(data.user); $("l-ok").disabled = false;
  if (r){ $("l-err").textContent = r === "bloqueado" ? "Tu acceso está bloqueado o pendiente de aprobación. Contacta al administrador." : "Tu cuenta no tiene perfil asignado. Contacta al administrador."; return; }
  $("dlg").close(); $("fl").reset(); await log("Inició sesión"); vista = "mascotas"; render();
});
$("l-x").onclick = () => $("dlg").close();

/* ---------- Mostrar / ocultar contraseña ---------- */
function ojos(root = document){
  root.querySelectorAll("input[type=password]:not([data-ojo])").forEach(i => {
    i.dataset.ojo = "1";
    const w = document.createElement("div"); w.className = "clave";
    i.parentNode.insertBefore(w, i); w.appendChild(i);
    const b = document.createElement("button"); b.type = "button"; b.className = "ojo"; b.textContent = "Mostrar";
    b.setAttribute("aria-label", "Mostrar contraseña"); b.setAttribute("aria-pressed", "false");
    b.onclick = () => {
      const ver = i.type === "password"; i.type = ver ? "text" : "password";
      b.textContent = ver ? "Ocultar" : "Mostrar"; b.setAttribute("aria-pressed", String(ver)); b.setAttribute("aria-label", ver ? "Ocultar contraseña" : "Mostrar contraseña");
    };
    w.appendChild(b);
  });
}
function ocultarClaves(root){ root.querySelectorAll("input[data-ojo]").forEach(i => { i.type = "password"; i.nextElementSibling.textContent = "Mostrar"; i.nextElementSibling.setAttribute("aria-pressed", "false"); }); }
ojos();
new MutationObserver(() => ojos($("app"))).observe($("app"), {childList: true, subtree: true});
["dlg", "dlg-cuenta"].forEach(id => $(id).addEventListener("close", () => ocultarClaves($(id))));

/* ---------- Mi cuenta ---------- */
$("c-x").onclick = () => $("dlg-cuenta").close();
$("fc-n").addEventListener("submit", async e => {
  e.preventDefault(); const n = $("c-nombre").value.trim(); if (!n) return;
  const { error } = await sb.rpc("actualizar_mi_nombre", {p_nombre: n});
  if (error) return toast("No se pudo guardar: " + error.message, true);
  perfil.nombre = n; pintarCabecera(); log("Cambió su nombre", "perfiles", n); toast("Nombre actualizado.");
});
$("fc-p").addEventListener("submit", async e => {
  e.preventDefault();
  const { data: { user } } = await sb.auth.getUser();
  const chk = await sb.auth.signInWithPassword({email: user.email, password: $("c-act").value});
  if (chk.error) return toast("La contraseña actual no es correcta.", true);
  const { error } = await sb.auth.updateUser({password: $("c-new").value});
  if (error) return toast("No se pudo cambiar: " + error.message, true);
  $("fc-p").reset(); log("Cambió su contraseña", "perfiles"); toast("Contraseña actualizada.");
});

/* ---------- Estructura ---------- */
function pintarCabecera(){
  $("sesion").innerHTML = perfil
    ? `<span class="chip">${esc(perfil.nombre)} · ${esc(perfil.rol)}</span><button class="btn" id="b-cuenta">Mi cuenta</button><button class="btn" id="b-salir">Salir</button>`
    : `<button class="btn pri" id="b-login">Iniciar sesión</button>`;
  if ($("b-login")) $("b-login").onclick = () => $("dlg").showModal();
  if ($("b-cuenta")) $("b-cuenta").onclick = () => { $("c-user").value = perfil.usuario || ""; $("c-nombre").value = perfil.nombre; $("dlg-cuenta").showModal(); };
  if ($("b-salir")) $("b-salir").onclick = async () => {
    try { await log("Cerró sesión"); await sb.auth.signOut(); } catch {}
    try { await sb.auth.signOut({scope: "local"}); } catch {}
    Object.keys(localStorage).filter(k => k.startsWith("sb-")).forEach(k => localStorage.removeItem(k)); // borra la sesión guardada
    perfil = null; selId = null; vista = "mascotas"; render();
  };
  const secs = [["mascotas","Mascotas"], ...(isAdmin() ? [["usuarios","Usuarios"],["actividad","Actividad"]] : [])];
  $("nav").innerHTML = !perfil ? "" : publicId ? `<button class="btn pri" id="b-avanzada">Abrir ficha avanzada</button>`
    : secs.map(([v,l]) => `<button class="btn ${v === vista ? "pri" : ""}" data-v="${v}">${l}</button>`).join("");
  if ($("b-avanzada")) $("b-avanzada").onclick = () => { forzarPublico = false; render(); };
  $("nav").querySelectorAll("[data-v]").forEach(b => b.onclick = () => { vista = b.dataset.v; render(); });
}
function render(){
  // Personal con sesión que abre un enlace público: pasa directo a la ficha avanzada
  if (publicId && perfil && !forzarPublico){ selId = publicId; publicId = null; history.replaceState(null, "", location.pathname); tab = "datos"; vista = "mascotas"; }
  pintarCabecera();
  if (publicId) return pintarPublico();
  if (!perfil) return $("app").innerHTML = `<div class="panel pad"><h2>Acceso del personal</h2><p>Inicia sesión como veterinario o administrador para ver el listado de pacientes. Los perfiles individuales se comparten con un enlace público.</p></div>`;
  if (vista !== "mascotas" && !isAdmin()) vista = "mascotas";
  ({mascotas: vistaMascotas, usuarios: vistaUsuarios, actividad: vistaActividad})[vista]();
}

/* ---------- Perfil público ---------- */
async function pintarPublico(){
  $("app").innerHTML = `<div class="panel pad">Cargando…</div>`;
  const { data, error } = await sb.rpc("mascota_publica", {p_id: publicId});
  if (error || !data) return $("app").innerHTML = `<div class="panel pad"><h2>Perfil no encontrado</h2><p>El enlace no corresponde a ninguna mascota registrada.</p></div>`;
  const m = data.mascota, hoyS = hoy();
  $("app").innerHTML = `<article class="panel pub">
    <div class="cab"><div class="avatar">${avatarHTML(m.foto_url, m.nombre)}</div><div class="cab-t"><h1>${esc(m.nombre)}</h1><span class="chip">${esc([m.especie, m.raza].filter(Boolean).join(" · "))}</span>
    <span class="${m.vacunas_al_dia ? "ok" : "venc"}">${m.vacunas_al_dia ? "Vacunas al día" : "Vacunas pendientes"}</span></div></div>
    <dl><dt>Sexo</dt><dd>${esc(m.sexo || "—")}</dd><dt>Edad</dt><dd>${edad(m.fecha_nacimiento)}</dd><dt>Color</dt><dd>${esc(m.color || "—")}</dd>
    <dt>Peso</dt><dd>${m.peso_kg ? esc(m.peso_kg) + " kg" : "—"}</dd><dt>Esterilizado</dt><dd>${m.esterilizado ? "Sí" : "No"}</dd><dt>Microchip</dt><dd>${esc(m.microchip || "—")}</dd></dl>
    <h3>Vacunas</h3><div class="tabla"><table><thead><tr><th>Vacuna</th><th>Fecha</th><th>Próxima dosis</th></tr></thead><tbody>
    ${data.vacunas.map(v => `<tr><td>${esc(v.vacuna)}</td><td>${fecha(v.fecha)}</td><td class="${v.proxima_dosis && v.proxima_dosis < hoyS ? "venc" : ""}">${fecha(v.proxima_dosis)}${v.proxima_dosis && v.proxima_dosis < hoyS ? " · vencida" : ""}</td></tr>`).join("") || `<tr><td colspan="3">Sin vacunas registradas.</td></tr>`}
    </tbody></table></div></article>`;
}

/* ---------- Mascotas (personal) ---------- */
async function cargarMascotas(){
  const { data, error } = await sb.from("mascotas").select("*").order("nombre");
  if (error) return toast("No se pudo cargar: " + error.message, true);
  mascotas = data; pintarLista(); pintarDetalle();
}
function vistaMascotas(){
  $("app").innerHTML = `<div class="layout"><aside class="panel lista" aria-label="Mascotas"><div class="lista-cab"><input id="buscar" type="search" placeholder="Buscar por nombre o dueño" aria-label="Buscar"><button class="btn pri" id="b-nueva">Nueva</button></div><ul id="lista"></ul></aside><section class="panel det" id="det"></section></div>`;
  $("buscar").oninput = pintarLista;
  $("b-nueva").onclick = () => { if (!descartar()) return; selId = null; nueva = true; editando = false; tab = "datos"; reiniciarFoto(); pintarLista(); pintarDetalle(); };
  cargarMascotas();
}
function descartar(){ return !(editando || nueva) || confirm("Tienes cambios sin guardar. ¿Descartarlos?"); }
function pintarLista(){
  const q = ($("buscar")?.value || "").trim().toLowerCase(), ul = $("lista");
  const f = mascotas.filter(m => (m.nombre + " " + (m.duenio_nombre || "")).toLowerCase().includes(q));
  ul.innerHTML = f.length ? "" : `<li class="vacio">${mascotas.length ? "Sin resultados." : "Aún no hay mascotas."}</li>`;
  f.forEach(m => {
    const li = document.createElement("li");
    li.innerHTML = `<button type="button" ${m.id === selId ? 'aria-current="true"' : ""}><span class="mini">${avatarHTML(m.foto_url, m.nombre)}</span><span><span class="n">${esc(m.nombre)}</span><span class="s">${esc([m.especie, m.raza, m.duenio_nombre].filter(Boolean).join(" · "))}</span></span></button>`;
    li.firstChild.onclick = () => { if (!descartar()) return; selId = m.id; nueva = false; editando = false; tab = "datos"; reiniciarFoto(); pintarLista(); pintarDetalle(); if (innerWidth <= 820) $("det").scrollIntoView({behavior: "smooth"}); };
    ul.appendChild(li);
  });
}
function reiniciarFoto(){ if (fotoPrev) URL.revokeObjectURL(fotoPrev); fotoArchivo = fotoPrev = null; fotoQuitada = false; }
function pintarDetalle(){
  const det = $("det"), m = mascotas.find(x => x.id === selId);
  if (!m && !nueva) return det.innerHTML = `<p class="vacio">Selecciona una mascota de la lista o registra una nueva.</p>`;
  det.innerHTML = `<input type="file" id="foto-in" accept="image/jpeg,image/png,image/webp" hidden><div class="cab" id="cab"></div>
    ${nueva ? "" : `<div class="tabs" role="tablist">${[["datos","Datos"], ...Object.entries(CLIN).map(([k,v]) => [k, v.t])].map(([k,l]) => `<button class="tab" role="tab" data-t="${k}" aria-current="${k === tab}">${l}</button>`).join("")}</div>`}
    <div id="cuerpo"></div>`;
  det.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; pintarDetalle(); });
  pintarCab();
  tab === "datos" ? pintarDatos(m) : pintarClin(tab);
}
function pintarCab(){
  const m = mascotas.find(x => x.id === selId) || {}, ed = editando || nueva;
  const url = fotoArchivo ? fotoPrev : (fotoQuitada ? null : m.foto_url);
  $("cab").innerHTML = `<div class="avatar">${avatarHTML(url, m.nombre)}</div><div class="cab-t"><h2>${nueva ? "Nueva mascota" : esc(m.nombre)}</h2>
    ${nueva ? "" : `<div class="fila"><button class="btn" id="b-copiar">Copiar enlace público</button><a class="btn" target="_blank" rel="noopener" href="${enlace(m.id)}&vista=publica">Ver perfil público</a></div>`}
    ${ed ? `<div class="fila"><button type="button" class="btn" id="b-foto">${url ? "Cambiar" : "Subir"} foto</button>${url ? '<button type="button" class="btn" id="b-qfoto">Quitar foto</button>' : ""}</div>` : ""}</div>`;
  if ($("b-copiar")) $("b-copiar").onclick = async () => { try { await navigator.clipboard.writeText(enlace(m.id)); toast("Enlace copiado."); } catch { prompt("Copia este enlace:", enlace(m.id)); } };
  if ($("b-foto")) $("b-foto").onclick = () => $("foto-in").click();
  if ($("b-qfoto")) $("b-qfoto").onclick = () => { reiniciarFoto(); fotoQuitada = true; pintarCab(); };
}
$("app").addEventListener("change", async e => {
  if (e.target.id !== "foto-in") return;
  const f = e.target.files[0]; e.target.value = "";
  if (!f || !/^image\/(jpeg|png|webp)$/.test(f.type)) return f && toast("Elige una imagen JPG, PNG o WebP.", true);
  try {
    const bmp = await createImageBitmap(f), k = Math.min(1, 800 / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k); c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .85));
    reiniciarFoto(); fotoArchivo = blob; fotoPrev = URL.createObjectURL(blob); pintarCab();
  } catch { toast("No se pudo leer la imagen.", true); }
});

function campo([k, l, t, o], v){
  if (t === "check") return `<div class="check"><input id="${k}" name="${k}" type="checkbox" ${v ? "checked" : ""}><label for="${k}">${l}</label></div>`;
  const i = t === "sel" ? `<select id="${k}" name="${k}">${o.map(x => `<option value="${x}" ${x === v ? "selected" : ""}>${x || "—"}</option>`).join("")}</select>`
    : t === "area" ? `<textarea id="${k}" name="${k}">${esc(v)}</textarea>`
    : `<input id="${k}" name="${k}" type="${t}" value="${esc(v)}" ${t === "number" ? 'step="0.01" min="0"' : ""}>`;
  return `<div class="${["area"].includes(t) || ["alergias","duenio_direccion"].includes(k) ? "full" : ""}"><label for="${k}">${l}</label>${i}</div>`;
}
function pintarDatos(m = {}){
  const ed = editando || nueva;
  $("cuerpo").innerHTML = `<form id="f" novalidate><fieldset ${ed ? "" : "disabled"}><div class="grid">${CAMPOS.map(c => campo(c, m[c[0]] ?? (c[0] === "especie" ? "Perro" : ""))).join("")}</div></fieldset>
    <div class="acciones">${ed ? `<button class="btn pri" id="b-guardar">Guardar cambios</button><button type="button" class="btn" id="b-cancelar">Cancelar</button>` : `<button type="button" class="btn pri" id="b-editar">Editar</button>`}
    <span class="esp"></span>${isAdmin() && !nueva ? `<button type="button" class="btn pel" id="b-eliminar">Eliminar</button>` : ""}</div></form>`;
  if ($("b-editar")) $("b-editar").onclick = () => { editando = true; pintarCab(); pintarDatos(m); };
  if ($("b-cancelar")) $("b-cancelar").onclick = () => { reiniciarFoto(); if (nueva) { nueva = false; pintarDetalle(); } else { editando = false; pintarCab(); pintarDatos(m); } };
  if ($("b-eliminar")) $("b-eliminar").onclick = () => eliminar(m);
  $("f").onsubmit = e => { e.preventDefault(); guardar(m); };
}
async function borrarFoto(url){ const p = url && url.split("/" + BUCKET + "/")[1]; if (p) await sb.storage.from(BUCKET).remove([decodeURIComponent(p.split("?")[0])]); }
async function guardar(m){
  const f = $("f"), fila = {};
  CAMPOS.forEach(([k,,t]) => { if (t === "check") fila[k] = f.elements[k].checked; else { const v = f.elements[k].value.trim(); fila[k] = v === "" ? null : t === "number" ? Number(v) : v; } });
  if (!fila.nombre) { toast("El nombre es obligatorio.", true); return f.elements.nombre.focus(); }
  fila.especie ||= "Perro";
  $("b-guardar").disabled = true; let subida = null;
  try {
    if (fotoArchivo){
      const ruta = crypto.randomUUID() + ".jpg";
      const { error } = await sb.storage.from(BUCKET).upload(ruta, fotoArchivo, {contentType: "image/jpeg"}); if (error) throw error;
      subida = sb.storage.from(BUCKET).getPublicUrl(ruta).data.publicUrl; fila.foto_url = subida;
    } else if (fotoQuitada) fila.foto_url = null;
    const q = nueva ? sb.from("mascotas").insert(fila) : sb.from("mascotas").update({...fila, actualizado_en: new Date().toISOString()}).eq("id", selId);
    const { data, error } = await q.select().single();
    if (error){ if (subida) borrarFoto(subida); throw error; }
    if (m?.foto_url && (subida || fotoQuitada)) borrarFoto(m.foto_url).catch(() => {});
    log(nueva ? "Creó mascota" : "Editó mascota", "mascotas", fila.nombre);
    selId = data.id; nueva = false; editando = false; reiniciarFoto(); await cargarMascotas(); toast("Cambios guardados.");
  } catch (err) { toast("No se pudo guardar: " + (err.message || "error"), true); $("b-guardar") && ($("b-guardar").disabled = false); }
}
async function eliminar(m){
  if (!confirm(`¿Eliminar la ficha de ${m.nombre} y todo su historial? Esta acción no se puede deshacer.`)) return;
  const { error } = await sb.from("mascotas").delete().eq("id", m.id);
  if (error) return toast("No se pudo eliminar: " + error.message, true);
  if (m.foto_url) borrarFoto(m.foto_url).catch(() => {});
  log("Eliminó mascota", "mascotas", m.nombre); selId = null; await cargarMascotas(); toast("Mascota eliminada.");
}

/* ---------- Historial clínico ---------- */
async function pintarClin(t){
  const cfg = CLIN[t], cu = $("cuerpo"), hoyS = hoy(); cu.innerHTML = `<p class="vacio">Cargando…</p>`;
  const { data, error } = await sb.from(t).select("*").eq("mascota_id", selId).order(cfg.o, {ascending: false});
  if (tab !== t) return;
  if (error) return cu.innerHTML = `<p class="vacio">No se pudo cargar: ${esc(error.message)}</p>`;
  const celda = (k, v) => k === "proxima_dosis" || k === "fecha" || k.startsWith("fecha_") ? (k === "proxima_dosis" && v && v < hoyS ? `<span class="venc">${fecha(v)} · vencida</span>` : fecha(v)) : esc(v ?? "—");
  cu.innerHTML = `<div class="tabla"><table><thead><tr>${cfg.c.map(c => `<th>${c[1]}</th>`).join("")}<th></th></tr></thead><tbody>
    ${data.map(r => `<tr>${cfg.c.map(([k]) => `<td>${celda(k, r[k])}</td>`).join("")}<td><button class="btn pel" data-del="${r.id}" aria-label="Eliminar registro">Quitar</button></td></tr>`).join("") || `<tr><td colspan="${cfg.c.length + 1}">Sin registros todavía.</td></tr>`}</tbody></table></div>
    <details><summary class="btn pri">Agregar registro</summary><form id="fa" class="grid">${cfg.c.map(([k,l,ty,req]) => `<div><label for="a-${k}">${l}${req ? " *" : ""}</label><input id="a-${k}" name="${k}" type="${ty}" ${req ? "required" : ""} ${ty === "number" ? 'step="0.01"' : ""}></div>`).join("")}<div class="full"><button class="btn pri">Guardar registro</button></div></form></details>`;
  cu.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("¿Quitar este registro?")) return;
    const { error } = await sb.from(t).delete().eq("id", b.dataset.del);
    if (error) return toast(error.message, true);
    log("Quitó registro", t, mascotas.find(x => x.id === selId)?.nombre); pintarClin(t);
  });
  $("fa").onsubmit = async e => {
    e.preventDefault(); const fila = {mascota_id: selId};
    cfg.c.forEach(([k,,ty]) => { const v = $("fa").elements[k].value.trim(); fila[k] = v === "" ? null : ty === "number" ? Number(v) : v; });
    const { error } = await sb.from(t).insert(fila);
    if (error) return toast("No se pudo guardar: " + error.message, true);
    log("Agregó registro", t, mascotas.find(x => x.id === selId)?.nombre); toast("Registro guardado."); pintarClin(t);
  };
}

/* ---------- Administración: usuarios ---------- */
async function llamarAdmin(body){
  const { data, error } = await sb.functions.invoke("admin-usuarios", {body});
  if (error){ let m = error.message; try { m = (await error.context.json()).error || m; } catch {} throw new Error(m); }
  if (data?.error) throw new Error(data.error);
  return data;
}
async function cambiarPerfil(id, cambios){
  const { data, error } = await sb.from("perfiles").update(cambios).eq("id", id).select();
  if (error) throw error;
  if (!data.length) throw new Error("No se aplicó el cambio. Verifica que seas administrador y que existan las políticas de perfiles.");
}
async function vistaUsuarios(){
  const { data, error } = await sb.from("perfiles").select("*").order("creado_en");
  if (error) return $("app").innerHTML = `<div class="panel pad">No se pudo cargar: ${esc(error.message)}</div>`;
  $("app").innerHTML = `<div class="panel pad"><h2>Usuarios</h2><div class="tabla"><table><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Acceso</th><th>Acciones</th></tr></thead><tbody>
    ${data.map(u => { const yo = u.id === perfil.id; return `<tr><td>${esc(u.nombre)}</td><td>${esc(u.usuario || "—")}</td>
    <td><select data-rol="${u.id}" aria-label="Rol de ${esc(u.nombre)}" ${yo ? "disabled" : ""}><option value="${ROL_VET}" ${u.rol === ROL_VET ? "selected" : ""}>Veterinario</option><option value="${ROL_ADMIN}" ${u.rol === ROL_ADMIN ? "selected" : ""}>Administrador</option></select></td>
    <td><button class="btn ${u.activo ? "" : "pel"}" data-act="${u.id}" ${yo ? "disabled" : ""}>${u.activo ? "Habilitado · Bloquear" : "Bloqueado · Habilitar"}</button></td>
    <td><div class="fila"><button class="btn" data-clave="${u.id}">Restablecer clave</button><button class="btn pel" data-del="${u.id}" ${yo ? "disabled" : ""}>Eliminar</button></div></td></tr>`; }).join("")}</tbody></table></div>
    <h3>Crear usuario</h3><form id="fu" class="grid" style="margin-top:12px"><div><label for="u-u">Usuario (para iniciar sesión)</label><input id="u-u" required pattern="[a-zA-Z0-9._-]{3,30}" autocapitalize="none"></div><div><label for="u-n">Nombre</label><input id="u-n" required></div>
    <div><label for="u-p">Contraseña (mín. 6)</label><input id="u-p" type="password" minlength="6" required autocomplete="new-password"></div>
    <div><label for="u-r">Rol</label><select id="u-r"><option value="${ROL_VET}">Veterinario</option><option value="${ROL_ADMIN}">Administrador</option></select></div>
    <div class="full"><button class="btn pri">Crear usuario</button></div></form></div>`;
  const por = id => data.find(u => u.id === id), id = n => n.dataset;
  const intentar = async (f, ok) => { try { await f(); toast(ok); vistaUsuarios(); } catch (err) { toast(err.message, true); vistaUsuarios(); } };
  document.querySelectorAll("[data-rol]").forEach(x => x.onchange = () => intentar(async () => {
    await cambiarPerfil(x.dataset.rol, {rol: x.value}); log("Cambió rol", "perfiles", por(x.dataset.rol).usuario + " → " + x.value);
  }, "Rol actualizado."));
  document.querySelectorAll("[data-act]").forEach(x => x.onclick = () => intentar(async () => {
    const u = por(x.dataset.act); await cambiarPerfil(u.id, {activo: !u.activo}); log(u.activo ? "Bloqueó usuario" : "Habilitó usuario", "perfiles", u.usuario);
  }, "Acceso actualizado."));
  document.querySelectorAll("[data-clave]").forEach(x => x.onclick = () => {
    const u = por(x.dataset.clave), p = prompt(`Nueva contraseña para ${u.usuario || u.nombre} (mín. 6 caracteres):`);
    if (!p) return;
    intentar(async () => { await llamarAdmin({accion: "clave", id: u.id, password: p}); log("Restableció contraseña", "perfiles", u.usuario); }, "Contraseña restablecida.");
  });
  document.querySelectorAll("[data-del]").forEach(x => x.onclick = () => {
    const u = por(x.dataset.del); if (!confirm(`¿Eliminar definitivamente a ${u.nombre} (${u.usuario})?`)) return;
    intentar(async () => { await llamarAdmin({accion: "eliminar", id: u.id}); log("Eliminó usuario", "perfiles", u.usuario); }, "Usuario eliminado.");
  });
  $("fu").onsubmit = e => {
    e.preventDefault(); const usuario = $("u-u").value.trim().toLowerCase(), rol = $("u-r").value;
    intentar(async () => { await llamarAdmin({accion: "crear", usuario, nombre: $("u-n").value.trim(), password: $("u-p").value, rol}); log("Creó usuario", "perfiles", usuario + " (" + rol + ")"); }, "Usuario creado.");
  };
}

/* ---------- Administración: actividad ---------- */
async function vistaActividad(){
  const { data, error } = await sb.from("registro_actividad").select("*").order("creado_en", {ascending: false}).limit(200);
  if (error) return $("app").innerHTML = `<div class="panel pad">No se pudo cargar: ${esc(error.message)}</div>`;
  $("app").innerHTML = `<div class="panel pad"><div class="fila" style="justify-content:space-between;margin-bottom:10px"><h2>Registro de actividad</h2><button class="btn" id="b-rec">Actualizar</button></div>
    <div class="tabla"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Sección</th><th>Detalle</th></tr></thead><tbody>
    ${data.map(r => `<tr><td>${new Date(r.creado_en).toLocaleString("es-EC")}</td><td>${esc(r.usuario_email)}</td><td>${esc(r.accion)}</td><td>${esc(r.entidad)}</td><td>${esc(r.detalle)}</td></tr>`).join("") || `<tr><td colspan="5">Sin actividad registrada.</td></tr>`}</tbody></table></div></div>`;
  $("b-rec").onclick = vistaActividad;
}

/* ---------- Inicio ---------- */
(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (session) await cargarPerfil(session.user);
  render();
})();
</script>
</body>
</html>
